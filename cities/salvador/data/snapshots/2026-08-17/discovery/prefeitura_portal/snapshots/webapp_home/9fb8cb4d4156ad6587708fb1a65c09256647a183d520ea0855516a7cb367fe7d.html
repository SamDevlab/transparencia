            var Contrast = {
                storage: 'contrastState',
                cssClass: 'contrast',
                currentState: null,
                check: checkContrast,
                getState: getContrastState,
                setState: setContrastState,
                toogle: toogleContrast,
                updateView: updateViewContrast
            };

            console.info(`Versão atual do Portal da Transparência: ${window?.env?.VERSAO} em ${window?.env?.DATA_VERSAO}`)

            window.toggleContrast = function () { Contrast.toogle(); };

            Contrast.check();

            function checkContrast() {
                this.updateView();
            }

            function getContrastState() {
                try {
                    return localStorage?.getItem(this.storage) === 'true' || false;
                } catch (erro) {
                    console.error(`Não foi possível realizar essa ação devido ao bloqueio de cookies - Index A - ${erro}`)
                }
            }

            function setContrastState(state) {
                try {
                    if(localStorage?.getItem('permitirCookiesAcessibilidade') === 'true' ||  localStorage?.getItem('permitirCookiesAcessibilidade') === null){
                        localStorage?.setItem(this.storage, '' + state);
                    }
                } catch (erro) {
                    console.error(`Não foi possível realizar essa ação devido ao bloqueio de cookies - Index B - ${erro}`)
                }
                // window.dispatchEvent( new Event('storage'));
                this.currentState = state;
                this.updateView();
            }

            function updateViewContrast() {
                var body = document.body;

                if (this.currentState === null)
                    this.currentState = this.getState();

                if (this.currentState)
                    body.classList.add(this.cssClass);
                else
                    body.classList.remove(this.cssClass);
            }

            function toogleContrast() {
                this.setState(!this.currentState);
            }


            function scrollAndFocus(element) {
                element.scrollIntoView({ behavior: 'smooth' });
                element.focus();
            }

            window.addEventListener('keydown', (event) => {

                if (event.altKey && !event.ctrlKey) {
                    event.preventDefault();

                    const key = event.key;

                    switch (key) {
                        case "1":
                            document.location.href = "/";
                            break;

                        case "2":
                            const menu = document.getElementById("menu").firstChild.firstChild;
                            scrollAndFocus(menu);
                            break;

                        case "3":
                            const buscar = document.querySelector("[aria-label='Buscar']");
                            scrollAndFocus(buscar);
                            break;

                        case "4":
                            const rodape = document.getElementById("rodape");
                            scrollAndFocus(rodape);
                            break;

                        case "5":
                            const reduzirFonte = document.querySelector("[aria-label='Reduzir Fonte']");
                            scrollAndFocus(reduzirFonte);
                            reduzirFonte.click();
                            break;

                        case "6":
                            const ampliarFonte = document.querySelector("[aria-label='Ampliar Fonte']");
                            scrollAndFocus(ampliarFonte);
                            ampliarFonte.click();
                            break;

                        case "7":
                            const contraste = document.querySelector("[aria-label='Contraste']");
                            scrollAndFocus(contraste);
                            contraste.click();
                            break;

                        case "8":
                            document.location.href = "/#/PerguntasFrequentes";
                            setTimeout(() => window.scrollTo(0, 0), 100);
                            break;

                        case "9":
                            const mapaSite = document.getElementById("grid-mapa-site");
                            scrollAndFocus(mapaSite);
                            break;

                        case "0":
                            document.location.href = "/#/Glossario";
                            setTimeout(() => window.scrollTo(0, 0), 100);
                            break;

                        default:
                            break;
                    }
                }
            });

        })();</script><script>!function(e){function c(c){for(var t,d,n=c[0],o=c[1],b=c[2],u=0,l=[];u<n.length;u++)d=n[u],Object.prototype.hasOwnProperty.call(f,d)&&f[d]&&l.push(f[d][0]),f[d]=0;for(t in o)Object.prototype.hasOwnProperty.call(o,t)&&(e[t]=o[t]);for(i&&i(c);l.length;)l.shift()();return r.push.apply(r,b||[]),a()}function a(){for(var e,c=0;c<r.length;c++){for(var a=r[c],t=!0,d=1;d<a.length;d++){var o=a[d];0!==f[o]&&(t=!1)}t&&(r.splice(c--,1),e=n(n.s=a[0]))}return e}var t={},d={10:0},f={10:0},r=[];function n(c){if(t[c])return t[c].exports;var a=t[c]={i:c,l:!1,exports:{}};return e[c].call(a.exports,a,a.exports,n),a.l=!0,a.exports}n.e=function(e){var c=[];d[e]?c.push(d[e]):0!==d[e]&&{5:1,7:1,8:1,12:1,13:1,14:1,15:1,16:1,17:1,18:1,19:1,20:1,21:1,22:1,23:1,24:1,25:1,26:1,27:1,28:1,29:1,30:1,31:1,32:1,33:1,34:1,35:1,36:1,37:1,38:1,39:1,40:1,41:1,42:1,43:1,44:1,45:1,46:1,47:1,48:1,49:1,50:1,51:1,52:1,53:1,54:1,55:1,56:1,57:1,58:1,59:1,60:1,61:1,62:1,63:1,64:1,65:1,66:1,67:1,68:1,70:1,71:1,72:1,73:1,74:1,75:1,77:1,78:1,79:1}[e]&&c.push(d[e]=new Promise((function(c,a){for(var t="static/css/"+({}[e]||e)+"."+{0:"31d6cfe0",1:"31d6cfe0",2:"31d6cfe0",3:"31d6cfe0",4:"31d6cfe0",5:"ca7d7514",6:"31d6cfe0",7:"32112fe9",8:"0bb78255",12:"f53f2de5",13:"afa45666",14:"af9d3a77",15:"20ad2b40",16:"549ab48f",17:"309ec059",18:"4e000ff9",19:"43d6c7ae",20:"2681447e",21:"54bf834a",22:"ccf363bc",23:"24144f5a",24:"55f7a4e5",25:"a6cfd5c2",26:"9c4c185b",27:"4ec21a0e",28:"8935078a",29:"b090e968",30:"b30b7278",31:"549aa325",32:"c275673d",33:"9f2895d5",34:"c7c06fb7",35:"46effd52",36:"bfda084b",37:"cddff68b",38:"9fb1269e",39:"1d9055bc",40:"2e9e9dab",41:"82ff6ce0",42:"f6663167",43:"61ad2d0f",44:"825eb5c0",45:"ab1f01c0",46:"b8968a2e",47:"d789d1c3",48:"128453a0",49:"8c8b6c1d",50:"b0ee6a44",51:"a252cedc",52:"d1c2c28c",53:"68b56aac",54:"059c9819",55:"a00e29b1",56:"888c3148",57:"888c3148",58:"888c3148",59:"888c3148",60:"888c3148",61:"888c3148",62:"888c3148",63:"28102710",64:"183dd719",65:"7eb9305a",
