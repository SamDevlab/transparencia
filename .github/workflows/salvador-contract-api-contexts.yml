name: salvador-contract-api-contexts

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-contract-api-contexts.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact contract frontend call contexts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('cities/salvador/data/snapshots/2026-08-17/discovery/prefeitura_portal/lazy_chunks')
          raw = root / 'raw'
          needles = [
              '/contratos/gridDetalhada?pagina=',
              '/contratos/gridDetalhadaDocumento?pagina=',
              '/contratos/detalhamentoContrato',
              '/contratos/aditivo?pagina=',
              '/contratos/empenhoRelacionado?pagina=',
              '/contratos/liquidacaoRelacionado?pagina=',
              '/contratos/pagamentoRelacionado?pagina=',
              '/filtro/contratos/filtros?funcao=fornecedores',
              '/FiscaisContratos/downloadcsv',
          ]
          rows = []
          for path in sorted(raw.glob('*.js')):
              text = path.read_text(encoding='utf-8', errors='replace')
              for needle in needles:
                  start = 0
                  while True:
                      idx = text.find(needle, start)
                      if idx < 0:
                          break
                      lo = max(0, idx - 4500)
                      hi = min(len(text), idx + len(needle) + 4500)
                      rows.append({
                          'chunk_sha256': path.stem,
                          'needle': needle,
                          'offset': idx,
                          'context': text[lo:hi],
                      })
                      start = idx + len(needle)
          out = root / 'contract_call_raw_contexts.json'
          out.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'extracted {len(rows)} contexts')
          for row in rows[:12]:
              print('\n---', row['needle'], row['chunk_sha256'], row['offset'])
              print(row['context'][:9000])
          PY
      - name: Commit contexts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17/discovery/prefeitura_portal/lazy_chunks/contract_call_raw_contexts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): extract exact contract frontend calls"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
