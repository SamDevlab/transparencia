name: salvador-contract-endpoint-probe

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-contract-short-probe.yml

permissions:
  contents: write

concurrency:
  group: salvador-contract-endpoint-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Probe current official contract endpoints with frontend filter shape
        run: |
          python - <<'PY'
          import hashlib, json, time
          from datetime import date, timedelta
          from pathlib import Path
          import httpx

          BASE='https://apitmptransparencia.salvador.ba.gov.br/api'
          headers={
            'accept':'application/json, text/plain, */*',
            'origin':'https://transparencia.salvador.ba.gov.br',
            'referer':'https://transparencia.salvador.ba.gov.br/',
            'user-agent':'municipal-transparency-research/0.4 (+public-data-audit)'
          }
          today=date.today()
          target=today-timedelta(days=1)
          body={
            'dataInicio':target.isoformat(),
            'dataFim':target.isoformat(),
            'agrupamentos':[],
            'filtros':[],
          }
          endpoints=[
            '/contratos/gridDetalhada?pagina=1',
            '/contratos/gridDetalhadaDocumento?pagina=1',
          ]
          out={
            'observed_at_date':today.isoformat(),
            'target_date':target.isoformat(),
            'request_body':body,
            'frontend_evidence':{
              'bundle_route':'/contratos/gridDetalhadaDocumento?pagina=',
              'bundle_snapshot':'cities/salvador/data/snapshots/2026-08-17/discovery/prefeitura_portal/lazy_chunks/contract_call_raw_contexts.json',
            },
            'probes':{},
          }
          with httpx.Client(headers=headers,follow_redirects=True,timeout=httpx.Timeout(35.0,connect=15.0)) as client:
            for endpoint in endpoints:
              started=time.monotonic()
              try:
                response=client.post(BASE+endpoint,json=body)
                raw=response.content
                item={
                  'status':response.status_code,
                  'elapsed_seconds':round(time.monotonic()-started,3),
                  'final_url':str(response.url),
                  'bytes':len(raw),
                  'content_type':response.headers.get('content-type'),
                  'sha256':hashlib.sha256(raw).hexdigest(),
                }
                try:
                  payload=response.json() if raw.strip() else None
                  item['json_type']=type(payload).__name__ if payload is not None else None
                  if isinstance(payload,dict):
                    item['top_level_keys']=sorted(payload.keys())
                    item['paginacao']=payload.get('paginacao')
                    for key in ('dados','data','content','items','registros'):
                      if isinstance(payload.get(key),list):
                        item['records_key']=key
                        item['records_count']=len(payload[key])
                        item['first_row_keys']=sorted(payload[key][0].keys()) if payload[key] and isinstance(payload[key][0],dict) else []
                        break
                  elif isinstance(payload,list):
                    item['records_count']=len(payload)
                    item['first_row_keys']=sorted(payload[0].keys()) if payload and isinstance(payload[0],dict) else []
                except Exception as exc:
                  item['json_error']=f'{type(exc).__name__}: {exc}'
                  item['text_preview']=response.text[:1000]
                out['probes'][endpoint]=item
              except Exception as exc:
                out['probes'][endpoint]={
                  'elapsed_seconds':round(time.monotonic()-started,3),
                  'error':f'{type(exc).__name__}: {exc}',
                }
          path=Path('cities/salvador/data/validation/contract_endpoint_probe.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY
      - name: Commit endpoint evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/validation/contract_endpoint_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): validate current contract endpoint"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
