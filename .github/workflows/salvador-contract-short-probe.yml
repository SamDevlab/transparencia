name: salvador-contract-endpoint-probe

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-contract-short-probe.yml

permissions:
  contents: write

concurrency:
  group: salvador-contract-endpoint-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Validate full-period contract query
        run: |
          python - <<'PY'
          import hashlib, json, time
          from datetime import date, timedelta
          from pathlib import Path
          import httpx

          BASE='https://apitmptransparencia.salvador.ba.gov.br/api'
          ENDPOINT='/contratos/gridDetalhada?pagina=1'
          headers={
            'accept':'application/json, text/plain, */*',
            'origin':'https://transparencia.salvador.ba.gov.br',
            'referer':'https://transparencia.salvador.ba.gov.br/',
            'user-agent':'municipal-transparency-research/0.4 (+public-data-audit)'
          }
          today=date.today()
          end=today-timedelta(days=1)
          start=date(end.year,1,1)
          body={'dataInicio':start.isoformat(),'dataFim':end.isoformat(),'agrupamentos':[],'filtros':[]}
          out={'observed_at_date':today.isoformat(),'endpoint':ENDPOINT,'request_body':body}
          started=time.monotonic()
          try:
            with httpx.Client(headers=headers,follow_redirects=True,timeout=httpx.Timeout(45.0,connect=15.0)) as client:
              response=client.post(BASE+ENDPOINT,json=body)
            raw=response.content
            out.update({
              'status':response.status_code,
              'elapsed_seconds':round(time.monotonic()-started,3),
              'bytes':len(raw),
              'sha256':hashlib.sha256(raw).hexdigest(),
            })
            payload=response.json() if raw.strip() else None
            if isinstance(payload,dict):
              pagination=payload.get('paginacao') or {}
              out['paginacao']={k:pagination.get(k) for k in ('paginaAtual','paginas','tamanho','total','totalPagina')}
              out['totalizadores']=payload.get('totalizadores')
              rows=payload.get('dados') or []
              out['records_on_first_page']=len(rows)
              out['first_row_contract_id']=rows[0].get('nuContratoSigef') if rows and isinstance(rows[0],dict) else None
          except Exception as exc:
            out['elapsed_seconds']=round(time.monotonic()-started,3)
            out['error']=f'{type(exc).__name__}: {exc}'
          path=Path('cities/salvador/data/validation/contract_full_period_probe.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY
      - name: Commit endpoint evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/validation/contract_full_period_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): validate full-period contract query"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
