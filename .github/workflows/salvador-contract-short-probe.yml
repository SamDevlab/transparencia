name: salvador-contract-short-probe

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-contract-short-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Probe exact official contract payloads
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import httpx

          BASE='https://apitmptransparencia.salvador.ba.gov.br/api'
          headers={
            'accept':'application/json, text/plain, */*',
            'origin':'https://transparencia.salvador.ba.gov.br',
            'referer':'https://transparencia.salvador.ba.gov.br/',
            'user-agent':'municipal-transparency-research/0.3 (+public-data-audit)'
          }
          cases=[]
          for start,end,label in [
            ('2026-08-17','2026-08-17','one_day'),
            ('2026-08-01','2026-08-17','august_partial'),
            ('2026-01-01','2026-01-31','january'),
          ]:
            body={'dataInicio':start,'dataFim':end}
            for path in ('/contratos/gridDetalhada?pagina=1','/contratos/gridDetalhadaDocumento?pagina=1'):
              cases.append((f'{label}:{path}',path,body))
          out={}
          with httpx.Client(headers=headers,follow_redirects=True,timeout=90) as client:
            for label,path,body in cases:
              try:
                r=client.post(BASE+path,json=body); raw=r.content
                item={
                  'request_body':body,
                  'status':r.status_code,
                  'final_url':str(r.url),
                  'bytes':len(raw),
                  'content_type':r.headers.get('content-type'),
                  'sha256':hashlib.sha256(raw).hexdigest(),
                }
                try:
                  j=r.json(); item['type']=type(j).__name__
                  if isinstance(j,dict):
                    item['top_level_keys']=sorted(j.keys())
                    for key in ('paginacao','totalizadores','total','paginas','pagina','quantidadeRegistros'):
                      if key in j: item[key]=j[key]
                    for key in ('dados','valor','items','registros','content'):
                      if isinstance(j.get(key),list):
                        item['list_key']=key; item['count']=len(j[key]); item['first_rows']=j[key][:5]; break
                  elif isinstance(j,list):
                    item['count']=len(j); item['first_rows']=j[:5]
                  item['json_preview']=json.dumps(j,ensure_ascii=False)[:40000]
                except Exception:
                  item['text_preview']=r.text[:12000]
                out[label]=item
              except Exception as exc:
                out[label]={'request_body':body,'error':f'{type(exc).__name__}: {exc}'}
            try:
              r=client.get(BASE+'/FiscaisContratos/downloadcsv'); raw=r.content
              out['fiscais_csv']={
                'status':r.status_code,'final_url':str(r.url),'bytes':len(raw),
                'content_type':r.headers.get('content-type'),
                'content_disposition':r.headers.get('content-disposition'),
                'sha256':hashlib.sha256(raw).hexdigest(),
                'text_preview':r.text[:12000],
              }
            except Exception as exc:
              out['fiscais_csv']={'error':f'{type(exc).__name__}: {exc}'}
          p=Path('cities/salvador/data/snapshots/2026-08-17/prefeitura_api/contract_short_probe.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)[:60000])
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17/prefeitura_api/contract_short_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): probe exact contract payloads"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
