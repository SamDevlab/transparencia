name: Normalizar cobertura Bahia

on:
  workflow_dispatch:
  push:
    branches:
      - city/salvador
    paths:
      - "scripts/normalize-bahia-state-status.py"
      - ".github/workflows/bahia-state-status.yml"
      - "regions/bahia/data/state_transparency/latest.json"
      - "regions/bahia/data/state_transparency/snapshots/**/coverage.json"
      - "regions/bahia/data/state_transparency/snapshots/**/sefaz_money_flow.json"

permissions:
  contents: write

concurrency:
  group: bahia-state-status
  cancel-in-progress: true

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalizar estado da cobertura
        run: python scripts/normalize-bahia-state-status.py
      - name: Versionar somente a cobertura
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions/bahia/data/state_transparency/latest.json regions/bahia/data/state_transparency/snapshots/*/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "data(bahia): consolidar cobertura SEFAZ processada [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          else
            echo "Cobertura já normalizada."
          fi
