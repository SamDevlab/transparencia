name: Contratos municipais Salvador

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * 1"
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-municipal-contracts.yml
      - src/transparencia/collectors/salvador_contracts.py
      - tests/test_salvador_contracts.py

permissions:
  contents: write

concurrency:
  group: salvador-municipal-contracts
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate collector
        id: tests
        continue-on-error: true
        run: pytest -q tests/test_salvador_contracts.py
      - name: Collect exact source-scoped municipal grid
        id: collection
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from transparencia.config import load_city
          from transparencia.collectors.salvador_contracts import collect

          root=Path('.').resolve()
          today=datetime.now(ZoneInfo('America/Bahia')).date()
          start=date(today.year,1,1)
          out=Path('cities/salvador/data/snapshots')/today.isoformat()/'prefeitura_contracts'
          city=load_city(root,'salvador').config
          output=collect(
              city,start,today,out,
              initial_window_days=366,
              page_workers=6,
              max_attempts=3,
              max_runtime_seconds=720,
          )
          coverage=json.loads((out/'coverage.json').read_text(encoding='utf-8'))
          print(json.dumps(coverage,ensure_ascii=False,indent=2,sort_keys=True))
          if not coverage.get('complete_for_filter'):
              raise SystemExit('A grade municipal não reconciliou paginação/total; snapshot permanece não-publicável.')
          print(output)
          PY
      - name: Record auditable run status
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COLLECTION_OUTCOME: ${{ steps.collection.outcome }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today=datetime.now(ZoneInfo('America/Bahia')).date()
          coverage_path=Path('cities/salvador/data/snapshots')/today.isoformat()/'prefeitura_contracts'/'coverage.json'
          coverage=json.loads(coverage_path.read_text(encoding='utf-8')) if coverage_path.exists() else None
          received=sum(int(item.get('records_received') or 0) for item in (coverage or {}).get('windows') or [])
          unique=int((coverage or {}).get('records_unique') or 0)
          report={
            'tested_commit':os.environ['TESTED_SHA'],
            'observed_at':datetime.now(ZoneInfo('America/Bahia')).isoformat(),
            'tests':os.environ.get('TEST_OUTCOME'),
            'collection':os.environ.get('COLLECTION_OUTCOME'),
            'complete_for_filter':bool((coverage or {}).get('complete_for_filter')),
            'period_start':(coverage or {}).get('period_start'),
            'period_end':(coverage or {}).get('period_end'),
            'records_received_across_windows':received,
            'records_unique':unique,
            'duplicate_rows_removed':max(0,received-unique),
            'logical_page_requests':(coverage or {}).get('logical_page_requests'),
            'http_attempts':(coverage or {}).get('http_attempts'),
            'runtime_seconds':(coverage or {}).get('runtime_seconds'),
            'budget_exhausted':(coverage or {}).get('budget_exhausted'),
            'page_workers':(coverage or {}).get('page_workers'),
            'windows':(coverage or {}).get('windows'),
            'coverage_note':(coverage or {}).get('coverage_note'),
          }
          path=Path('cities/salvador/data/validation/municipal_contracts_run.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          PY
      - name: Commit evidence and complete snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=America/Bahia date +%F)
          git add cities/salvador/data/validation/municipal_contracts_run.json
          if [ -f "cities/salvador/data/snapshots/${TODAY}/prefeitura_contracts/coverage.json" ]; then
            COMPLETE=$(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo('America/Bahia')).date()
          p=Path('cities/salvador/data/snapshots')/today.isoformat()/'prefeitura_contracts'/'coverage.json'
          print('yes' if json.loads(p.read_text(encoding='utf-8')).get('complete_for_filter') else 'no')
          PY
            )
            if [ "$COMPLETE" = "yes" ]; then
              git add "cities/salvador/data/snapshots/${TODAY}/prefeitura_contracts"
            fi
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): record municipal contract collection"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
      - name: Require valid complete collection
        if: steps.tests.outcome != 'success' || steps.collection.outcome != 'success'
        run: |
          echo "tests=${{ steps.tests.outcome }} collection=${{ steps.collection.outcome }}"
          exit 1
