name: Contratos municipais Salvador

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * 1"
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-municipal-contracts.yml
      - src/transparencia/collectors/salvador_contracts.py
      - tests/test_salvador_contracts.py

permissions:
  contents: write

concurrency:
  group: salvador-municipal-contracts
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate collector
        run: pytest -q tests/test_salvador_contracts.py
      - name: Collect exact source-scoped municipal grid
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from transparencia.config import load_city
          from transparencia.collectors.salvador_contracts import collect

          root=Path('.').resolve()
          today=datetime.now(ZoneInfo('America/Bahia')).date()
          start=date(today.year,1,1)
          out=Path('cities/salvador/data/snapshots')/today.isoformat()/'prefeitura_contracts'
          city=load_city(root,'salvador').config
          output=collect(
              city,start,today,out,
              initial_window_days=366,
              page_workers=6,
              max_attempts=3,
              max_runtime_seconds=720,
          )
          coverage=json.loads((out/'coverage.json').read_text(encoding='utf-8'))
          print(json.dumps(coverage,ensure_ascii=False,indent=2,sort_keys=True))
          if not coverage.get('complete_for_filter'):
              raise SystemExit('A grade municipal não reconciliou paginação/total; snapshot permanece não-publicável.')
          if coverage.get('records_unique') != sum(int(w.get('records_received') or 0) for w in coverage.get('windows') or []):
              raise SystemExit('Deduplicação alterou a contagem de uma coleta de janela única; revisar antes de publicar.')
          print(output)
          PY
      - name: Commit complete municipal contract snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=America/Bahia date +%F)
          git add "cities/salvador/data/snapshots/${TODAY}/prefeitura_contracts"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): refresh complete municipal contracts"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
