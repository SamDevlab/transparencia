name: Inteligência econômica Bahia e Salvador

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 13 * *"
  push:
    branches:
      - city/salvador
    paths:
      - ".github/workflows/economic-intelligence.yml"
      - "src/transparencia/collectors/comex.py"
      - "scripts/collect-bahia-economy.py"
      - "tests/test_comex.py"
      - "regions/bahia/config.json"
      - "regions/bahia/sources.csv"

permissions:
  contents: write

concurrency:
  group: economic-intelligence-bahia
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e '.[dev]'
      - name: Validar métricas econômicas
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p regions/bahia/data/validation
          set +e
          pytest -q tests/test_comex.py 2>&1 | tee regions/bahia/data/validation/test_comex.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Coletar Comex Stat
        id: collect
        continue-on-error: true
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p regions/bahia/data/validation
          SNAPSHOT_DATE=$(date -u +%F)
          set +e
          python scripts/collect-bahia-economy.py --out "regions/bahia/data/snapshots/${SNAPSHOT_DATE}" 2>&1 | tee regions/bahia/data/validation/collect_comex.log
          code=${PIPESTATUS[0]}
          if [ $code -eq 0 ]; then
            test -s "regions/bahia/data/snapshots/${SNAPSHOT_DATE}/coverage.json" || code=1
          fi
          if [ -s "regions/bahia/data/snapshots/${SNAPSHOT_DATE}/coverage.json" ]; then
            cat "regions/bahia/data/snapshots/${SNAPSHOT_DATE}/coverage.json"
          fi
          exit $code
      - name: Registrar diagnóstico e dados produzidos
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p regions/bahia/data
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path, lines=40):
              p = Path(path)
              if not p.exists():
                  return []
              return p.read_text(encoding='utf-8', errors='replace').splitlines()[-lines:]

          payload = {
              "tested_commit": os.environ["TESTED_SHA"],
              "tests": os.environ["TEST_OUTCOME"],
              "collector": os.environ["COLLECT_OUTCOME"],
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "test_log_tail": tail('regions/bahia/data/validation/test_comex.log'),
              "collector_log_tail": tail('regions/bahia/data/validation/collect_comex.log'),
          }
          Path("regions/bahia/data/workflow_status.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          rm -f regions/bahia/data/validation/test_comex.log regions/bahia/data/validation/collect_comex.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions/bahia/data
          if ! git diff --cached --quiet; then
            git commit -m "data(economia): registrar coleta e diagnóstico [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          else
            echo "Nenhuma alteração econômica para versionar."
          fi
      - name: Exigir testes e coleta válidos
        if: steps.tests.outcome != 'success' || steps.collect.outcome != 'success'
        run: |
          echo "tests=${{ steps.tests.outcome }} collector=${{ steps.collect.outcome }}"
          exit 1
