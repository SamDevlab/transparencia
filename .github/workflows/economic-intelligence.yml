name: Inteligência econômica Bahia e Salvador

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 13 * *"
  push:
    branches:
      - city/salvador
    paths:
      - ".github/workflows/economic-intelligence.yml"
      - "src/transparencia/collectors/comex.py"
      - "scripts/collect-bahia-economy.py"
      - "tests/test_comex.py"
      - "regions/bahia/config.json"
      - "regions/bahia/sources.csv"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e '.[dev]'
      - name: Validar métricas econômicas
        run: pytest -q tests/test_comex.py
      - name: Coletar Comex Stat
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          SNAPSHOT_DATE=$(date -u +%F)
          python scripts/collect-bahia-economy.py --out "regions/bahia/data/snapshots/${SNAPSHOT_DATE}"
          cat "regions/bahia/data/snapshots/${SNAPSHOT_DATE}/coverage.json"
      - name: Versionar snapshot e hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions/bahia/data
          if ! git diff --cached --quiet; then
            git commit -m "data(economia): atualizar Comex Bahia e Salvador"
            git push
          else
            echo "Nenhuma alteração econômica para versionar."
          fi
