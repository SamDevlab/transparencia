name: Auditoria de duplicidade dos contratos de Salvador

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-contract-dedup-audit.yml
      - scripts/audit-salvador-contract-dedup.py
      - cities/salvador/data/snapshots/**/prefeitura_contracts/**

permissions:
  contents: write

concurrency:
  group: salvador-contract-dedup-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit duplicate semantics
        run: python scripts/audit-salvador-contract-dedup.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/validation/municipal_contracts_dedup_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(salvador): record municipal contract duplicate analysis [skip ci]"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
