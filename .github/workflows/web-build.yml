name: Construção do site

on:
  push:
    branches:
      - city/salvador
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/build-web-data.mjs"
      - "scripts/overlay-municipal-contracts.mjs"
      - "scripts/build-economy-web-data.mjs"
      - "scripts/build-bahia-regional-data.mjs"
      - "scripts/compact-bahia-web-data.mjs"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/web-build.yml"
      - "cities/salvador/data/seed/**"
      - "cities/salvador/data/snapshots/**"
      - "cities/salvador/data/final/**"
      - "regions/bahia/**"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/build-web-data.mjs"
      - "scripts/overlay-municipal-contracts.mjs"
      - "scripts/build-economy-web-data.mjs"
      - "scripts/build-bahia-regional-data.mjs"
      - "scripts/compact-bahia-web-data.mjs"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/web-build.yml"
      - "cities/salvador/data/seed/**"
      - "cities/salvador/data/snapshots/**"
      - "cities/salvador/data/final/**"
      - "regions/bahia/**"

permissions:
  contents: write

concurrency:
  group: web-build-city-salvador
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do site
        run: npm install --no-audit --no-fund
      - name: Construir site
        run: npm run build
      - name: Verificar conjuntos de dados gerados
        run: |
          for file in dashboard acquisitions processes contracts suppliers agencies finance camara agents analysis money comparisons search meta economy transparency bahia-transparency; do
            test -s "public/data/${file}.json"
          done
          node - <<'NODE'
          const d = require('./public/data/meta.json');
          const contractsPublic = require('./public/data/contracts.json');
          const economy = require('./public/data/economy.json');
          const transparency = require('./public/data/transparency.json');
          const bahiaTransparency = require('./public/data/bahia-transparency.json');

          if (!(d.acquisitions > 0)) throw new Error(`aquisições ausentes: ${d.acquisitions}`);
          if (d.processes !== d.acquisitions) throw new Error(`processos gerados: ${d.processes}; aquisições: ${d.acquisitions}`);
          if (d.officials !== 43) throw new Error(`vereadores gerados: ${d.officials}`);
          if (d.executiveAgents < 6) throw new Error(`agentes do Executivo gerados: ${d.executiveAgents}`);
          if (d.publicAgents < 49) throw new Error(`agentes públicos gerados: ${d.publicAgents}`);
          if (!(Array.isArray(contractsPublic.rows) && contractsPublic.rows.length > 0)) throw new Error('contratos individualizados ausentes');
          if (!(d.suppliers > 0) || !(d.agencies > 0)) throw new Error('dados municipais derivados incompletos');
          if (!(d.searchItems > d.acquisitions)) throw new Error(`itens de consulta insuficientes: ${d.searchItems}`);
          if (!/^\d{4}-\d{2}-\d{2}$/.test(d.snapshotDate || '')) throw new Error(`snapshot inválido: ${d.snapshotDate}`);

          if (contractsPublic.sourceSystem === 'SALVADOR_TRANSPARENCIA_API_CONTRATOS') {
            if (contractsPublic.completeForFilter !== true) throw new Error('grade municipal promovida sem completude');
            if (!(contractsPublic.rows.length > 0)) throw new Error('grade municipal completa sem linhas');
            if (!/^\d{4}-\d{2}-\d{2}$/.test(contractsPublic.periodStart || '') || !/^\d{4}-\d{2}-\d{2}$/.test(contractsPublic.periodEnd || '')) throw new Error('período municipal inválido');
            if (d.municipalContractsAvailable !== true) throw new Error('metadado municipal divergente');
            if (d.contractsPrimaryRows !== contractsPublic.rows.length) throw new Error('contagem municipal do meta divergente');
          } else if (d.contractsPrimarySource && d.contractsPrimarySource !== 'PNCP') {
            throw new Error(`fonte primária de contratos inesperada: ${d.contractsPrimarySource}`);
          }

          if (typeof economy.available !== 'boolean') throw new Error('economy.available ausente');
          if (!economy.interstate?.available || economy.interstate?.baseline?.reference_year !== 2017) throw new Error('linha de base interestadual inválida');
          if (economy.interstate?.keySectors?.reference_year !== 2012) throw new Error('ano da MIP Bahia divergente');
          if (!Array.isArray(transparency.datasets) || transparency.datasets.length < 8) throw new Error('cobertura integrada incompleta');
          if (!(bahiaTransparency.mappedSources >= 8)) throw new Error(`fontes estaduais mapeadas insuficientes: ${bahiaTransparency.mappedSources}`);

          const sefaz = bahiaTransparency.sefaz?.summary;
          if ((sefaz?.processed ?? 0) >= 2) {
            const revenues = bahiaTransparency.sefaz?.revenues?.summary;
            const procurements = bahiaTransparency.sefaz?.procurements?.summary;
            if (!revenues || !(revenues.rows > 0) || revenues.selected_year !== 2026) throw new Error('Receitas SEFAZ sem recorte válido');
            if (!procurements?.primary_licitacoes || !(procurements.primary_licitacoes.rows_selected_year > 0)) throw new Error('Licitações SEFAZ sem tabela anual válida');
          }
          if ((sefaz?.processed ?? 0) >= 4) {
            const expenses = bahiaTransparency.sefaz?.expenses?.summary;
            const payments = bahiaTransparency.sefaz?.payments?.summary;
            if (!expenses?.primary_table || expenses.selected_year !== 2026 || !(expenses.primary_table.selected_rows > 0)) throw new Error('Despesas SEFAZ inválidas');
            const stages = expenses.primary_table.stage_totals || {};
            if (!stages.committed || !stages.liquidated || !stages.paid) throw new Error('Estágios de despesa incompletos');
            if (!payments?.primary_table || payments.selected_year !== 2026 || !(payments.primary_table.selected_rows > 0)) throw new Error('Pagamentos SEFAZ inválidos');
            if (!payments.selected_year_payment?.source_field || payments.selected_year_payment?.sum == null) throw new Error('Campo de pagamento não auditável');
          }
          if ((sefaz?.processed ?? 0) >= 5) {
            const stateContracts = bahiaTransparency.sefaz?.contracts?.summary;
            const primary = stateContracts?.primary_table;
            if (!primary || stateContracts.selected_year !== 2026) throw new Error('Contratos SEFAZ sem tabela principal/recorte válido');
            if (!(primary.unique_instruments > 0)) throw new Error('Contratos sem instrumentos únicos');
            if (!primary.schema?.detected_fields?.contract) throw new Error('Contratos sem identificador oficial');
            if (primary.contract_value?.deduplicated_sum == null) throw new Error('Contratos sem valor deduplicado');
            if (primary.contract_value?.raw_relation_sum_diagnostic_only === primary.contract_value?.deduplicated_sum && primary.selected_rows !== primary.unique_instruments) throw new Error('Deduplicação contratual não aplicada');
          }
          const flow = bahiaTransparency.sefaz?.moneyFlow;
          if (flow) {
            if (flow.selected_year !== 2026) throw new Error('Fio do dinheiro fora do recorte 2026');
            for (const key of ['instruments_procurement_to_contract','instruments_contract_to_payment','instruments_end_to_end']) {
              if (typeof flow.summary?.[key] !== 'number') throw new Error(`Fio do dinheiro sem ${key}`);
            }
            if (!String(flow.identity_rule || '').includes('identificador oficial')) throw new Error('Regra de identidade do fio do dinheiro ausente');
          }
          console.log({ ...d, contractsPrimary: contractsPublic.sourceSystem || contractsPublic.source, contractsRows: contractsPublic.rows.length, bahiaState: bahiaTransparency.status, sefaz, moneyFlow: flow?.summary || null });
          NODE
      - name: Registrar construção bem-sucedida
        if: github.event_name == 'push'
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p cities/salvador/data/validation
          node - <<'NODE'
          const fs = require('fs');
          const meta = require('./public/data/meta.json');
          const contractsPublic = require('./public/data/contracts.json');
          const economy = require('./public/data/economy.json');
          const bahiaTransparency = require('./public/data/bahia-transparency.json');
          const stateRevenues = bahiaTransparency.sefaz?.revenues?.summary;
          const stateProcurements = bahiaTransparency.sefaz?.procurements?.summary;
          const stateExpenses = bahiaTransparency.sefaz?.expenses?.summary;
          const statePayments = bahiaTransparency.sefaz?.payments?.summary;
          const stateContracts = bahiaTransparency.sefaz?.contracts?.summary;
          const flow = bahiaTransparency.sefaz?.moneyFlow?.summary;
          const payload = {
            passed: true,
            tested_commit: process.env.TESTED_SHA,
            node: process.version,
            next: require('./node_modules/next/package.json').version,
            react: require('./node_modules/react/package.json').version,
            snapshot_used: meta.snapshotDate,
            acquisitions_generated: meta.acquisitions,
            processes_generated: meta.processes,
            contracts_primary_source: contractsPublic.sourceSystem || contractsPublic.source || null,
            contracts_primary_rows: contractsPublic.rows?.length || 0,
            municipal_contracts_available: meta.municipalContractsAvailable === true,
            municipal_contracts_period_start: meta.municipalContractsPeriodStart || null,
            municipal_contracts_period_end: meta.municipalContractsPeriodEnd || null,
            pncp_contracts_complementary: meta.pncpContractsComplementary ?? null,
            suppliers_generated: meta.suppliers,
            agencies_generated: meta.agencies,
            exact_cross_source_links: meta.exactCrossSourceLinks,
            councilors_generated: meta.officials,
            executive_agents_generated: meta.executiveAgents,
            public_agents_generated: meta.publicAgents,
            search_items_generated: meta.searchItems,
            economy_available: economy.available,
            economy_snapshot: economy.snapshot || null,
            interstate_baseline_available: meta.interstateBaselineAvailable,
            state_transparency_available: bahiaTransparency.available,
            state_transparency_snapshot: bahiaTransparency.snapshot,
            state_sefaz_processed: bahiaTransparency.sefaz?.summary?.processed || 0,
            state_sefaz_expected: bahiaTransparency.sefaz?.summary?.expected || 0,
            state_revenue_rows: stateRevenues?.rows || 0,
            state_revenue_2026_realized: stateRevenues?.selected_year_totals?.realized ?? null,
            state_procurements_2026: stateProcurements?.primary_licitacoes?.rows_selected_year || 0,
            state_procurements_2026_homologated: stateProcurements?.primary_licitacoes?.homologated_value?.sum ?? null,
            state_expense_rows_2026: stateExpenses?.primary_table?.selected_rows || 0,
            state_expense_2026_committed: stateExpenses?.primary_table?.stage_totals?.committed?.sum ?? null,
            state_expense_2026_liquidated: stateExpenses?.primary_table?.stage_totals?.liquidated?.sum ?? null,
            state_expense_2026_paid: stateExpenses?.primary_table?.stage_totals?.paid?.sum ?? null,
            state_payment_rows_2026: statePayments?.primary_table?.selected_rows || 0,
            state_payments_2026: statePayments?.selected_year_payment?.sum ?? null,
            state_contract_relation_rows_2026: stateContracts?.primary_table?.selected_rows || 0,
            state_contract_unique_instruments_2026: stateContracts?.primary_table?.unique_instruments || 0,
            state_contract_value_deduplicated: stateContracts?.primary_table?.contract_value?.deduplicated_sum ?? null,
            state_contract_value_field: stateContracts?.primary_table?.contract_value?.field ?? null,
            state_contract_process_keys_2026: stateContracts?.primary_table?.unique_process_keys || 0,
            state_money_flow_available: Boolean(flow),
            state_procurement_contract_instruments: flow?.instruments_procurement_to_contract || 0,
            state_contract_payment_instruments: flow?.instruments_contract_to_payment || 0,
            state_end_to_end_instruments: flow?.instruments_end_to_end || 0,
            state_end_to_end_payment_value: flow?.payment_value_end_to_end ?? null,
            as_of: meta.asOf,
          };
          fs.writeFileSync('cities/salvador/data/validation/web_build.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/validation/web_build.json
          if ! git diff --cached --quiet; then
            git commit -m "ci(web): registrar construção bem-sucedida [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          fi
