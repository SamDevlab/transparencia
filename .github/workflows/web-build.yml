name: Construção do site

on:
  push:
    branches:
      - city/salvador
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/build-web-data.mjs"
      - "scripts/build-economy-web-data.mjs"
      - "scripts/build-bahia-regional-data.mjs"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/web-build.yml"
      - "cities/salvador/data/seed/**"
      - "cities/salvador/data/snapshots/**"
      - "cities/salvador/data/final/**"
      - "regions/bahia/**"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/build-web-data.mjs"
      - "scripts/build-economy-web-data.mjs"
      - "scripts/build-bahia-regional-data.mjs"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/web-build.yml"
      - "cities/salvador/data/seed/**"
      - "cities/salvador/data/snapshots/**"
      - "cities/salvador/data/final/**"
      - "regions/bahia/**"

permissions:
  contents: write

concurrency:
  group: web-build-city-salvador
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do site
        run: npm install --no-audit --no-fund
      - name: Construir site para a Vercel
        run: npm run build
      - name: Verificar conjuntos de dados gerados
        run: |
          for file in dashboard acquisitions processes contracts suppliers agencies finance camara agents analysis money comparisons search meta economy transparency bahia-transparency; do
            test -s "public/data/${file}.json"
          done
          node - <<'NODE'
          const d = require('./public/data/meta.json');
          const economy = require('./public/data/economy.json');
          const transparency = require('./public/data/transparency.json');
          const bahiaTransparency = require('./public/data/bahia-transparency.json');
          if (d.acquisitions !== 2306) throw new Error(`aquisições geradas: ${d.acquisitions}`);
          if (d.processes !== d.acquisitions) throw new Error(`processos gerados: ${d.processes}`);
          if (d.officials !== 43) throw new Error(`vereadores gerados: ${d.officials}`);
          if (d.executiveAgents < 6) throw new Error(`agentes do Executivo gerados: ${d.executiveAgents}`);
          if (d.publicAgents < 49) throw new Error(`agentes públicos gerados: ${d.publicAgents}`);
          if (!(d.contracts > 0)) throw new Error(`contratos PNCP insuficientes: ${d.contracts}`);
          if (!(d.suppliers > 0)) throw new Error(`fornecedores insuficientes: ${d.suppliers}`);
          if (!(d.agencies > 0)) throw new Error(`órgãos insuficientes: ${d.agencies}`);
          if (!(d.searchItems > d.acquisitions)) throw new Error(`itens de consulta insuficientes: ${d.searchItems}`);
          if (typeof d.exactCrossSourceLinks !== 'number') throw new Error('contagem de vínculos entre fontes ausente');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(d.snapshotDate || '')) throw new Error(`snapshot inválido: ${d.snapshotDate}`);
          if (typeof economy.available !== 'boolean') throw new Error('economy.available ausente');
          if (!economy.interstate?.available) throw new Error('linha de base interestadual não carregada');
          if (economy.interstate?.baseline?.reference_year !== 2017) throw new Error('ano da matriz interestadual divergente');
          if (economy.interstate?.keySectors?.reference_year !== 2012) throw new Error('ano da MIP Bahia divergente');
          if (!Array.isArray(transparency.datasets) || transparency.datasets.length < 8) throw new Error('cobertura integrada incompleta');
          if (!(bahiaTransparency.mappedSources >= 8)) throw new Error(`fontes estaduais mapeadas insuficientes: ${bahiaTransparency.mappedSources}`);
          if (economy.available && (!economy.bahia?.summary || !economy.salvador?.summary)) throw new Error('snapshot econômico disponível sem resumos Bahia/Salvador');
          console.log({ ...d, economicCoverage: economy.coverage, bahiaState: bahiaTransparency.status });
          NODE
      - name: Registrar construção bem-sucedida
        if: github.event_name == 'push'
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p cities/salvador/data/validation
          node - <<'NODE'
          const fs = require('fs');
          const meta = require('./public/data/meta.json');
          const economy = require('./public/data/economy.json');
          const bahiaTransparency = require('./public/data/bahia-transparency.json');
          const payload = {
            passed: true,
            tested_commit: process.env.TESTED_SHA,
            node: process.version,
            next: require('./node_modules/next/package.json').version,
            react: require('./node_modules/react/package.json').version,
            snapshot_used: meta.snapshotDate,
            acquisitions_generated: meta.acquisitions,
            processes_generated: meta.processes,
            contracts_generated: meta.contracts,
            suppliers_generated: meta.suppliers,
            agencies_generated: meta.agencies,
            exact_cross_source_links: meta.exactCrossSourceLinks,
            councilors_generated: meta.officials,
            executive_agents_generated: meta.executiveAgents,
            public_agents_generated: meta.publicAgents,
            search_items_generated: meta.searchItems,
            economy_available: economy.available,
            economy_snapshot: economy.snapshot || null,
            bahia_economic_products: meta.bahiaEconomicProducts || 0,
            salvador_economic_products: meta.salvadorEconomicProducts || 0,
            interstate_baseline_available: meta.interstateBaselineAvailable,
            interstate_reference_year: meta.interstateReferenceYear,
            mip_reference_year: meta.mipReferenceYear,
            state_transparency_available: bahiaTransparency.available,
            state_transparency_snapshot: bahiaTransparency.snapshot,
            state_transparency_mapped_sources: bahiaTransparency.mappedSources,
            as_of: meta.asOf,
          };
          fs.writeFileSync('cities/salvador/data/validation/web_build.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/validation/web_build.json
          if ! git diff --cached --quiet; then
            git commit -m "ci(web): registrar construção bem-sucedida [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          fi
