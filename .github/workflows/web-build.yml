name: Web build

on:
  push:
    branches:
      - city/salvador
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/build-web-data.mjs"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/web-build.yml"
      - "cities/salvador/data/seed/**"
      - "cities/salvador/data/snapshots/**"
      - "cities/salvador/data/final/**"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/build-web-data.mjs"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/web-build.yml"
      - "cities/salvador/data/seed/**"
      - "cities/salvador/data/snapshots/**"
      - "cities/salvador/data/final/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vercel frontend
        run: npm run build
      - name: Verify generated datasets
        run: |
          test -s public/data/dashboard.json
          test -s public/data/acquisitions.json
          test -s public/data/finance.json
          test -s public/data/camara.json
          node -e "const d=require('./public/data/meta.json'); if(d.acquisitions!==2306) process.exit(1); console.log(d)"
      - name: Record successful build
        if: github.event_name == 'push'
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p cities/salvador/data/validation
          node - <<'NODE'
          const fs = require('fs');
          const meta = require('./public/data/meta.json');
          const payload = {
            passed: true,
            tested_commit: process.env.TESTED_SHA,
            node: process.version,
            next: require('./node_modules/next/package.json').version,
            react: require('./node_modules/react/package.json').version,
            acquisitions_generated: meta.acquisitions,
            officials_generated: meta.officials,
            as_of: meta.asOf,
          };
          fs.writeFileSync('cities/salvador/data/validation/web_build.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/validation/web_build.json
          if ! git diff --cached --quiet; then
            git commit -m "ci(web): record successful frontend build [skip ci]"
            git push
          fi
