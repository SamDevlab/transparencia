name: Construção do site

on:
  push:
    branches:
      - city/salvador
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/build-web-data.mjs"
      - "scripts/build-economy-web-data.mjs"
      - "scripts/build-bahia-regional-data.mjs"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/web-build.yml"
      - "cities/salvador/data/seed/**"
      - "cities/salvador/data/snapshots/**"
      - "cities/salvador/data/final/**"
      - "regions/bahia/**"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/build-web-data.mjs"
      - "scripts/build-economy-web-data.mjs"
      - "scripts/build-bahia-regional-data.mjs"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/web-build.yml"
      - "cities/salvador/data/seed/**"
      - "cities/salvador/data/snapshots/**"
      - "cities/salvador/data/final/**"
      - "regions/bahia/**"

permissions:
  contents: write

concurrency:
  group: web-build-city-salvador
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do site
        run: npm install --no-audit --no-fund
      - name: Construir site para a Vercel
        run: npm run build
      - name: Verificar conjuntos de dados gerados
        run: |
          for file in dashboard acquisitions processes contracts suppliers agencies finance camara agents analysis money comparisons search meta economy transparency bahia-transparency; do
            test -s "public/data/${file}.json"
          done
          node - <<'NODE'
          const d = require('./public/data/meta.json');
          const economy = require('./public/data/economy.json');
          const transparency = require('./public/data/transparency.json');
          const bahiaTransparency = require('./public/data/bahia-transparency.json');
          if (d.acquisitions !== 2306) throw new Error(`aquisições geradas: ${d.acquisitions}`);
          if (d.processes !== d.acquisitions) throw new Error(`processos gerados: ${d.processes}`);
          if (d.officials !== 43) throw new Error(`vereadores gerados: ${d.officials}`);
          if (d.executiveAgents < 6) throw new Error(`agentes do Executivo gerados: ${d.executiveAgents}`);
          if (d.publicAgents < 49) throw new Error(`agentes públicos gerados: ${d.publicAgents}`);
          if (!(d.contracts > 0)) throw new Error(`contratos PNCP insuficientes: ${d.contracts}`);
          if (!(d.suppliers > 0)) throw new Error(`fornecedores insuficientes: ${d.suppliers}`);
          if (!(d.agencies > 0)) throw new Error(`órgãos insuficientes: ${d.agencies}`);
          if (!(d.searchItems > d.acquisitions)) throw new Error(`itens de consulta insuficientes: ${d.searchItems}`);
          if (typeof d.exactCrossSourceLinks !== 'number') throw new Error('contagem de vínculos entre fontes ausente');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(d.snapshotDate || '')) throw new Error(`snapshot inválido: ${d.snapshotDate}`);
          if (typeof economy.available !== 'boolean') throw new Error('economy.available ausente');
          if (!economy.interstate?.available) throw new Error('linha de base interestadual não carregada');
          if (economy.interstate?.baseline?.reference_year !== 2017) throw new Error('ano da matriz interestadual divergente');
          if (economy.interstate?.keySectors?.reference_year !== 2012) throw new Error('ano da MIP Bahia divergente');
          if (!Array.isArray(transparency.datasets) || transparency.datasets.length < 8) throw new Error('cobertura integrada incompleta');
          if (!(bahiaTransparency.mappedSources >= 8)) throw new Error(`fontes estaduais mapeadas insuficientes: ${bahiaTransparency.mappedSources}`);
          if (economy.available && (!economy.bahia?.summary || !economy.salvador?.summary)) throw new Error('snapshot econômico disponível sem resumos Bahia/Salvador');
          const sefaz = bahiaTransparency.sefaz?.summary;
          if ((sefaz?.processed ?? 0) >= 2) {
            const revenues = bahiaTransparency.sefaz?.revenues?.summary;
            const procurements = bahiaTransparency.sefaz?.procurements?.summary;
            if (!revenues || !(revenues.rows > 0)) throw new Error('Receitas SEFAZ declaradas como processadas sem resumo válido');
            if (!revenues.selected_year_totals || revenues.selected_year !== 2026) throw new Error('Receitas SEFAZ sem recorte 2026 válido');
            if (!procurements?.primary_licitacoes) throw new Error('Licitações SEFAZ sem tabela principal identificada');
            if (!(procurements.primary_licitacoes.rows_selected_year > 0)) throw new Error('Licitações SEFAZ sem contagem anual válida');
          }
          if ((sefaz?.processed ?? 0) >= 4) {
            const expenses = bahiaTransparency.sefaz?.expenses?.summary;
            const payments = bahiaTransparency.sefaz?.payments?.summary;
            if (!expenses?.primary_table || expenses.selected_year !== 2026) throw new Error('Despesas SEFAZ sem tabela principal/recorte 2026 válido');
            if (!(expenses.primary_table.selected_rows > 0)) throw new Error('Despesas SEFAZ sem linhas 2026');
            const stages = expenses.primary_table.stage_totals || {};
            if (!stages.committed && !stages.liquidated && !stages.paid) throw new Error('Despesas SEFAZ sem estágio financeiro detectado');
            if (!payments?.primary_table || payments.selected_year !== 2026) throw new Error('Pagamentos SEFAZ sem tabela principal/recorte 2026 válido');
            if (!(payments.primary_table.selected_rows > 0)) throw new Error('Pagamentos SEFAZ sem linhas 2026');
            if (!payments.selected_year_payment?.source_field || payments.selected_year_payment?.sum == null) throw new Error('Pagamentos SEFAZ sem campo monetário auditável');
          }
          if ((sefaz?.processed ?? 0) >= 5) {
            const contracts = bahiaTransparency.sefaz?.contracts?.summary;
            if (!contracts?.primary_table || contracts.selected_year !== 2026) throw new Error('Contratos SEFAZ sem tabela principal/recorte 2026 válido');
            if (!(contracts.primary_table.selected_rows > 0)) throw new Error('Contratos SEFAZ sem linhas 2026');
            if (!contracts.primary_table.schema?.detected_fields?.contract) throw new Error('Contratos SEFAZ sem identificador oficial detectado');
            if (!(contracts.primary_table.instrument_index?.length > 0)) throw new Error('Contratos SEFAZ sem chaves oficiais de instrumento');
          }
          console.log({ ...d, economicCoverage: economy.coverage, bahiaState: bahiaTransparency.status, sefaz });
          NODE
      - name: Registrar construção bem-sucedida
        if: github.event_name == 'push'
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p cities/salvador/data/validation
          node - <<'NODE'
          const fs = require('fs');
          const meta = require('./public/data/meta.json');
          const economy = require('./public/data/economy.json');
          const bahiaTransparency = require('./public/data/bahia-transparency.json');
          const stateRevenues = bahiaTransparency.sefaz?.revenues?.summary;
          const stateProcurements = bahiaTransparency.sefaz?.procurements?.summary;
          const stateExpenses = bahiaTransparency.sefaz?.expenses?.summary;
          const statePayments = bahiaTransparency.sefaz?.payments?.summary;
          const stateContracts = bahiaTransparency.sefaz?.contracts?.summary;
          const payload = {
            passed: true,
            tested_commit: process.env.TESTED_SHA,
            node: process.version,
            next: require('./node_modules/next/package.json').version,
            react: require('./node_modules/react/package.json').version,
            snapshot_used: meta.snapshotDate,
            acquisitions_generated: meta.acquisitions,
            processes_generated: meta.processes,
            contracts_generated: meta.contracts,
            suppliers_generated: meta.suppliers,
            agencies_generated: meta.agencies,
            exact_cross_source_links: meta.exactCrossSourceLinks,
            councilors_generated: meta.officials,
            executive_agents_generated: meta.executiveAgents,
            public_agents_generated: meta.publicAgents,
            search_items_generated: meta.searchItems,
            economy_available: economy.available,
            economy_snapshot: economy.snapshot || null,
            bahia_economic_products: meta.bahiaEconomicProducts || 0,
            salvador_economic_products: meta.salvadorEconomicProducts || 0,
            interstate_baseline_available: meta.interstateBaselineAvailable,
            interstate_reference_year: meta.interstateReferenceYear,
            mip_reference_year: meta.mipReferenceYear,
            state_transparency_available: bahiaTransparency.available,
            state_transparency_snapshot: bahiaTransparency.snapshot,
            state_transparency_mapped_sources: bahiaTransparency.mappedSources,
            state_sefaz_processed: bahiaTransparency.sefaz?.summary?.processed || 0,
            state_sefaz_expected: bahiaTransparency.sefaz?.summary?.expected || 0,
            state_revenue_rows: stateRevenues?.rows || 0,
            state_revenue_2026_realized: stateRevenues?.selected_year_totals?.realized ?? null,
            state_procurements_2026: stateProcurements?.primary_licitacoes?.rows_selected_year || 0,
            state_procurements_2026_estimated: stateProcurements?.primary_licitacoes?.estimated_value?.sum ?? null,
            state_procurements_2026_homologated: stateProcurements?.primary_licitacoes?.homologated_value?.sum ?? null,
            state_expense_rows_2026: stateExpenses?.primary_table?.selected_rows || 0,
            state_expense_2026_committed: stateExpenses?.primary_table?.stage_totals?.committed?.sum ?? null,
            state_expense_2026_liquidated: stateExpenses?.primary_table?.stage_totals?.liquidated?.sum ?? null,
            state_expense_2026_paid: stateExpenses?.primary_table?.stage_totals?.paid?.sum ?? null,
            state_payment_rows_2026: statePayments?.primary_table?.selected_rows || 0,
            state_payments_2026: statePayments?.selected_year_payment?.sum ?? null,
            state_payment_source_field: statePayments?.selected_year_payment?.source_field ?? null,
            state_contract_rows_2026: stateContracts?.primary_table?.selected_rows || 0,
            state_contract_value_2026: stateContracts?.primary_table?.contract_value?.sum ?? null,
            state_contract_value_field: stateContracts?.primary_table?.contract_value?.field ?? null,
            state_contract_instrument_keys_2026: stateContracts?.primary_table?.instrument_index?.length || 0,
            state_contract_process_keys_2026: stateContracts?.primary_table?.process_ids?.length || 0,
            state_contract_cnpj_suppliers_published: stateContracts?.primary_table?.top_suppliers_cnpj_only?.length || 0,
            as_of: meta.asOf,
          };
          fs.writeFileSync('cities/salvador/data/validation/web_build.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/validation/web_build.json
          if ! git diff --cached --quiet; then
            git commit -m "ci(web): registrar construção bem-sucedida [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          fi
