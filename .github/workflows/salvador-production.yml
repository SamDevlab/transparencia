name: salvador-production

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-production.yml
      - src/transparencia/salvador_project.py
      - src/transparencia/coverage.py
      - src/transparencia/reconcile.py
      - src/transparencia/collectors/salvador_*.py
      - src/transparencia/collectors/cms*.py

permissions:
  contents: write

concurrency:
  group: salvador-production
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test before collection
        run: pytest -q
      - name: Run Salvador production pipeline
        run: |
          END=$(date -u +%F)
          YEAR=$(date -u +%Y)
          OUT="cities/salvador/data/snapshots/${END}/production"
          transparencia --repo-root . --city salvador collect-salvador \
            --start "${YEAR}-01-01" --end "${END}" --out "${OUT}"
          # SQLite is a derived artifact and is rebuilt from versioned source-linked files.
          find "${OUT}" -name '*.db' -delete
      - name: Test after collection
        run: pytest -q
      - name: Commit source-linked production snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): refresh production snapshot"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
