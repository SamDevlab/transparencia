name: Vínculos licitação contrato Bahia

on:
  workflow_dispatch:
  schedule:
    - cron: "10 13 * * 3"
  push:
    branches:
      - city/salvador
    paths:
      - ".github/workflows/bahia-procurement-contract-links.yml"
      - "src/transparencia/collectors/bahia_sefaz_procurement_links.py"
      - "scripts/build-bahia-procurement-contract-links.py"
      - "tests/test_bahia_sefaz_procurement_links.py"

permissions:
  contents: write

concurrency:
  group: bahia-procurement-contract-links
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e '.[dev]'
      - name: Validar vínculo exato
        run: pytest -q tests/test_bahia_sefaz_procurement_links.py
      - name: Gerar mapa aquisição instrumento
        run: python scripts/build-bahia-procurement-contract-links.py
      - name: Registrar diagnóstico
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('regions/bahia/data/state_transparency/latest.json').read_text())
          snapshot = Path(latest['path'])
          links = json.loads((snapshot / 'sefaz_licitacoes_contratos_links.json').read_text())
          payload = {
            'status': 'success',
            'snapshot': latest['snapshot'],
            'selected_year': links['summary']['selected_year'],
            'exact_link_count': links['summary']['exact_link_count'],
            'processes_with_instruments': links['summary']['processes_with_instruments'],
            'unique_instruments': links['summary']['unique_instruments'],
            'source_tables': links['summary']['source_tables'],
            'fields': links['summary']['fields'],
          }
          out = Path('regions/bahia/data/validation/procurement_contract_links_run.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Versionar mapa derivado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions/bahia/data/state_transparency regions/bahia/data/validation/procurement_contract_links_run.json
          if ! git diff --cached --quiet; then
            git commit -m "data(bahia): atualizar vínculos aquisição contrato [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          fi
