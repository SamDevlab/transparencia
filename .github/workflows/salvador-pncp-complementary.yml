name: PNCP complementar Salvador

on:
  workflow_dispatch:
  schedule:
    - cron: "35 13 * * 3"
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-pncp-complementary.yml
      - src/transparencia/collectors/pncp_contracts.py
      - cities/salvador/city.json

permissions:
  contents: write

concurrency:
  group: salvador-pncp-complementary
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate PNCP contract collector
        run: pytest -q tests/test_pncp_contracts.py
      - name: Collect bounded complementary PNCP contracts
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from transparencia.collectors import pncp_contracts
          from transparencia.config import load_city

          today = datetime.now(ZoneInfo('America/Bahia')).date()
          start = date(today.year, 1, 1)
          root = Path('.')
          out = Path('cities/salvador/data/snapshots') / today.isoformat() / 'pncp_complementary'
          contract_dir = out / 'contracts'
          out.mkdir(parents=True, exist_ok=True)

          city = load_city(root, 'salvador').config
          municipal_cnpj = ''.join(ch for ch in str(city.municipality_cnpj or '') if ch.isdigit())
          errors = []
          contract_path = None
          contract_cov = None

          if len(municipal_cnpj) != 14:
              errors.append({
                  'step': 'configuration',
                  'type': 'MissingMunicipalityCNPJ',
                  'error': 'city.municipality_cnpj is not a 14-digit CNPJ',
              })
          else:
              try:
                  contract_path = pncp_contracts.collect(
                      city,
                      start,
                      today,
                      contract_dir,
                      agency_cnpjs=[municipal_cnpj],
                      scope='municipal',
                      sleep_seconds=0.05,
                      max_attempts=2,
                  )
                  coverage_path = contract_dir / 'coverage.json'
                  if coverage_path.exists():
                      contract_cov = json.loads(coverage_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append({'step': 'contracts', 'type': type(exc).__name__, 'error': str(exc)})

          contract_records = 0
          if contract_path and contract_path.exists():
              contract_records = sum(1 for line in contract_path.read_text(encoding='utf-8').splitlines() if line.strip())

          summary = {
              'observed_at_date': today.isoformat(),
              'period_start': start.isoformat(),
              'period_end': today.isoformat(),
              'role': 'complementary_only',
              'collection_mode': 'bounded_official_municipality_cnpj',
              'agency_cnpjs_supplied': [municipal_cnpj] if len(municipal_cnpj) == 14 else [],
              'agency_cnpj_discovery_complete': False,
              'contracts': {
                  'ran': contract_path is not None,
                  'complete_for_supplied_agencies_and_filter': bool((contract_cov or {}).get('complete_for_supplied_agencies_and_filter')),
                  'records': (contract_cov or {}).get('records_after_salvador_scope_filter', contract_records),
                  'query_errors': len((contract_cov or {}).get('errors') or []),
              },
              'errors': errors,
              'coverage_rule': (
                  'PNCP is complementary only. This bounded run queries the official municipality CNPJ from city configuration and can be complete only for that supplied CNPJ and date filter. '
                  'It does not claim that the municipality CNPJ represents every municipal entity CNPJ. Missing PNCP coverage never removes or invalidates the independently collected Salvador contract grid.'
              ),
          }
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Commit bounded PNCP evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=America/Bahia date +%F)
          if [ ! -d "cities/salvador/data/snapshots/${TODAY}/pncp_complementary" ]; then exit 0; fi
          git add "cities/salvador/data/snapshots/${TODAY}/pncp_complementary"
          if git diff --cached --quiet; then echo 'No PNCP changes'; exit 0; fi
          git commit -m "data(salvador): refresh bounded complementary PNCP evidence"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
