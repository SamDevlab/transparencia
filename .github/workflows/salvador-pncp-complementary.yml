name: PNCP complementar Salvador

on:
  workflow_dispatch:
  schedule:
    - cron: "35 13 * * 3"
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-pncp-complementary.yml
      - scripts/run-salvador-pncp-complementary.py
      - src/transparencia/collectors/pncp.py
      - src/transparencia/collectors/pncp_contracts.py
      - cities/salvador/city.json

permissions:
  contents: write

concurrency:
  group: salvador-pncp-complementary
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate PNCP collectors
        run: pytest -q tests/test_pncp.py tests/test_pncp_contracts.py
      - name: Validate staged runner syntax
        run: python -m py_compile scripts/run-salvador-pncp-complementary.py
      - name: Collect, validate and atomically promote PNCP evidence
        run: python scripts/run-salvador-pncp-complementary.py
      - name: Commit complementary PNCP evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=America/Bahia date +%F)
          if [ -d "cities/salvador/data/snapshots/${TODAY}/pncp_complementary" ]; then
            git add "cities/salvador/data/snapshots/${TODAY}/pncp_complementary"
          fi
          for report in \
            cities/salvador/data/validation/pncp_complementary_last_attempt.json \
            cities/salvador/data/validation/pncp_complementary_reconciliation.json; do
            if [ -f "$report" ]; then git add "$report"; fi
          done
          if git diff --cached --quiet; then echo 'No PNCP changes'; exit 0; fi
          git commit -m "data(salvador): refresh complementary PNCP evidence"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
