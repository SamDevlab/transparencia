name: Fio do dinheiro Bahia

on:
  workflow_dispatch:
  schedule:
    - cron: "40 12 * * 2"
  push:
    branches:
      - city/salvador
    paths:
      - ".github/workflows/bahia-sefaz-money-flow.yml"
      - "src/transparencia/collectors/bahia_sefaz_money_flow.py"
      - "src/transparencia/collectors/bahia_sefaz_contract_profiles.py"
      - "src/transparencia/collectors/bahia_sefaz_procurement_links.py"
      - "src/transparencia/collectors/bahia_sefaz_download.py"
      - "scripts/process-bahia-money-flow.py"
      - "tests/test_bahia_sefaz_money_flow.py"
      - "tests/test_bahia_sefaz_contract_profiles.py"
      - "tests/test_bahia_sefaz_procurement_links.py"
      - "regions/bahia/data/state_transparency/latest.json"
      - "regions/bahia/data/state_transparency/snapshots/**/sefaz_contratos.json"

permissions:
  contents: write

concurrency:
  group: bahia-sefaz-money-flow
  cancel-in-progress: true

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e '.[dev]'
      - name: Validar vínculos exatos e perfis contratuais
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p regions/bahia/data/validation
          set +e
          pytest -q \
            tests/test_bahia_sefaz_money_flow.py \
            tests/test_bahia_sefaz_contract_profiles.py \
            tests/test_bahia_sefaz_procurement_links.py \
            2>&1 | tee regions/bahia/data/validation/money_flow_tests.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Processar fio do dinheiro
        if: steps.tests.outcome == 'success'
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/process-bahia-money-flow.py --year 2026 \
            2>&1 | tee regions/bahia/data/validation/money_flow_collect.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Registrar diagnóstico
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def read_json(path, fallback=None):
              p = Path(path)
              if not p.exists():
                  return fallback
              return json.loads(p.read_text(encoding='utf-8'))

          def tail(path, lines=120):
              p = Path(path)
              if not p.exists():
                  return []
              return p.read_text(encoding='utf-8', errors='replace').splitlines()[-lines:]

          state = Path('regions/bahia/data/state_transparency')
          latest = read_json(state / 'latest.json', {})
          snapshot = Path(latest.get('path', '')) if latest.get('path') else None
          flow = read_json(snapshot / 'sefaz_money_flow.json') if snapshot else None
          payload = {
              'tested_commit': os.environ['TESTED_SHA'],
              'tests': os.environ.get('TEST_OUTCOME'),
              'collector': os.environ.get('COLLECT_OUTCOME'),
              'workflow_finished_at': datetime.now(timezone.utc).isoformat(),
              'latest': latest,
              'summary': flow.get('summary') if flow else None,
              'identity_rule': flow.get('identity_rule') if flow else None,
              'contract_profile_identity_rule': flow.get('contract_profile_identity_rule') if flow else None,
              'contract_profile_ambiguity_rule': flow.get('contract_profile_ambiguity_rule') if flow else None,
              'test_log_tail': tail('regions/bahia/data/validation/money_flow_tests.log'),
              'collector_log_tail': tail('regions/bahia/data/validation/money_flow_collect.log'),
          }
          out = Path('regions/bahia/data/validation/sefaz_money_flow_run.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f regions/bahia/data/validation/money_flow_tests.log regions/bahia/data/validation/money_flow_collect.log
      - name: Versionar resumo auditável
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions/bahia/data/state_transparency regions/bahia/data/validation/sefaz_money_flow_run.json
          if ! git diff --cached --quiet; then
            git commit -m "data(bahia): atualizar fio exato do dinheiro [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          else
            echo "Nenhuma alteração no fio do dinheiro para versionar."
          fi
      - name: Exigir processamento válido
        if: steps.tests.outcome != 'success' || steps.collect.outcome != 'success'
        run: |
          echo "tests=${{ steps.tests.outcome }} collector=${{ steps.collect.outcome }}"
          exit 1
