name: Transparência estadual da Bahia

on:
  workflow_dispatch:
  schedule:
    - cron: "40 10 * * 2"
  push:
    branches:
      - city/salvador
    paths:
      - ".github/workflows/bahia-state-transparency.yml"
      - "src/transparencia/collectors/bahia_open_data.py"
      - "scripts/collect-bahia-state-transparency.py"
      - "tests/test_bahia_open_data.py"
      - "regions/bahia/data/reference/state_transparency_catalog.json"

permissions:
  contents: write

concurrency:
  group: bahia-state-transparency
  cancel-in-progress: true

jobs:
  metadados:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e '.[dev]'
      - name: Validar parser estadual
        run: pytest -q tests/test_bahia_open_data.py
      - name: Coletar metadados SEFAZ/CKAN
        run: |
          SNAPSHOT_DATE=$(date -u +%F)
          python scripts/collect-bahia-state-transparency.py \
            --year 2026 \
            --skip-tce-large \
            --out "regions/bahia/data/state_transparency/snapshots/${SNAPSHOT_DATE}"
          cat "regions/bahia/data/state_transparency/snapshots/${SNAPSHOT_DATE}/coverage.json"
      - name: Publicar checkpoint estadual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions/bahia/data/state_transparency
          if ! git diff --cached --quiet; then
            git commit -m "data(transparencia): atualizar metadados estaduais da Bahia [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          fi

  enriquecer_tce:
    needs: metadados
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e '.[dev]'
      - name: Tentar enriquecimento TCE/BA
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p regions/bahia/data/validation
          SNAPSHOT_DATE=$(date -u +%F)
          set +e
          python scripts/collect-bahia-state-transparency.py \
            --year 2026 \
            --out "regions/bahia/data/state_transparency/snapshots/${SNAPSHOT_DATE}" \
            2>&1 | tee regions/bahia/data/validation/state_collect.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Registrar cobertura estadual
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path, lines=80):
              p = Path(path)
              return p.read_text(encoding='utf-8', errors='replace').splitlines()[-lines:] if p.exists() else []

          root = Path('regions/bahia/data/state_transparency')
          latest = root / 'latest.json'
          payload = {
              'tested_commit': os.environ['TESTED_SHA'],
              'collector': os.environ.get('COLLECT_OUTCOME'),
              'workflow_finished_at': datetime.now(timezone.utc).isoformat(),
              'latest_exists': latest.exists(),
              'collector_log_tail': tail('regions/bahia/data/validation/state_collect.log'),
          }
          if latest.exists():
              pointer = json.loads(latest.read_text(encoding='utf-8'))
              payload['latest'] = pointer
              coverage = Path(pointer['path']) / 'coverage.json'
              if coverage.exists():
                  payload['coverage'] = json.loads(coverage.read_text(encoding='utf-8'))
          Path('regions/bahia/data/validation').mkdir(parents=True, exist_ok=True)
          Path('regions/bahia/data/validation/state_transparency_run.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          rm -f regions/bahia/data/validation/state_collect.log
      - name: Versionar enriquecimento e diagnóstico
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions/bahia/data/state_transparency regions/bahia/data/validation/state_transparency_run.json
          if ! git diff --cached --quiet; then
            git commit -m "data(transparencia): enriquecer fontes estaduais da Bahia [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          fi
      - name: Exigir execução técnica do coletor
        if: steps.collect.outcome != 'success'
        run: exit 1
