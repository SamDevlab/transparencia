name: salvador-api-extract

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-api-extract.yml
      - scripts/extract_salvador_api_services.py

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/extract_salvador_api_services.py
      - name: Commit extracted service map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17/discovery/prefeitura_portal/api_service_calls.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): extract official portal API service map"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
