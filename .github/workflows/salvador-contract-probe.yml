name: salvador-contract-probe

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-contract-probe.yml
      - cities/salvador/data/snapshots/2026-08-17/discovery/prefeitura_portal/lazy_chunks/contract_supplier_routes.json

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Probe exact contract and supplier routes from official frontend
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import httpx

          BASE='https://apitmptransparencia.salvador.ba.gov.br/api'
          headers={'accept':'application/json, text/plain, */*','origin':'https://transparencia.salvador.ba.gov.br','referer':'https://transparencia.salvador.ba.gov.br/','user-agent':'municipal-transparency-research/0.2 (+public-data-audit)'}
          dates={'dataInicio':'2026-01-01','dataFim':'2026-08-17'}
          full={**dates,'agrupamentos':[],'filtros':[]}
          probes=[
            ('GET','/contratos/gridDetalhada?pagina=1',{}),
            ('GET','/contratos/gridDetalhada?pagina=1',dates),
            ('GET','/contratos/gridDetalhadaDocumento?pagina=1',dates),
            ('GET','/filtro/contratos/filtros?funcao=fornecedores',{}),
            ('POST','/contratos/gridDetalhada?pagina=1',full),
            ('POST','/contratos/gridDetalhadaDocumento?pagina=1',full),
          ]
          out={}
          def meta(r):
            raw=r.content
            item={'status':r.status_code,'final_url':str(r.url),'content_type':r.headers.get('content-type'),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
            try:
              j=r.json(); item['type']=type(j).__name__
              if isinstance(j,dict):
                item['top_level_keys']=sorted(j.keys())
                for k in ('dados','valor','items','registros'):
                  if isinstance(j.get(k),list): item['list_key']=k; item['count']=len(j[k]); item['first_rows']=j[k][:3]; break
                item['paginacao']=j.get('paginacao'); item['totalizadores']=j.get('totalizadores')
              elif isinstance(j,list): item['count']=len(j); item['first_rows']=j[:3]
              item['json_preview']=json.dumps(j,ensure_ascii=False)[:20000]
            except Exception: item['text_preview']=r.text[:12000]
            return item
          with httpx.Client(headers=headers,follow_redirects=True,timeout=40) as client:
            for i,(method,path,payload) in enumerate(probes):
              key=f'{i}_{method}_{path}'
              try:
                r=client.get(BASE+path,params=payload) if method=='GET' else client.post(BASE+path,json=payload)
                out[key]={'request':{'method':method,'path':path,'payload':payload},**meta(r)}
              except Exception as exc: out[key]={'request':{'method':method,'path':path,'payload':payload},'error':f'{type(exc).__name__}: {exc}'}
          p=Path('cities/salvador/data/snapshots/2026-08-17/prefeitura_api/contract_probe.json'); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)[:60000])
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17/prefeitura_api/contract_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): probe official contract supplier API"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
