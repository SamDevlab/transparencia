name: salvador-cms-finance-summary

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - scripts/summarize_cms_finance_probe.py
      - .github/workflows/salvador-cms-finance-summary.yml

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/summarize_cms_finance_probe.py
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17/cms_finance_probe_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): summarize Câmara finance endpoints"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
