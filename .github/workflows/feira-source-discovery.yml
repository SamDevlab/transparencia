name: Feira de Santana — descoberta de fontes

on:
  workflow_dispatch:
  push:
    branches: [city/feira-de-santana]
    paths:
      - "cities/feira-de-santana/**"
      - "src/transparencia/**"
      - "tests/test_feira_adapter.py"
      - ".github/workflows/feira-source-discovery.yml"

permissions:
  contents: write

concurrency:
  group: feira-source-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/feira-de-santana
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Preserve verified source entry points with bounded retries
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from transparencia.config import load_city
          from transparencia.coverage import CoverageEntry, CoverageManifest
          from transparencia.http import fetch_and_archive

          today = datetime.now(ZoneInfo('America/Bahia')).date().isoformat()
          root = Path.cwd()
          ws = load_city(root, 'feira-de-santana')
          out = root / 'cities' / 'feira-de-santana' / 'data' / 'snapshots' / today / 'source_discovery'
          raw = out / 'raw'
          out.mkdir(parents=True, exist_ok=True)

          rows = []
          manifest = CoverageManifest(city_slug=ws.config.slug, period_start=today, period_end=today)
          for source in ws.sources:
              source_id = (source.get('id') or '').strip()
              url = (source.get('url') or '').strip()
              if not source_id or not url:
                  continue
              item = {'source_id': source_id, 'url': url}
              try:
                  meta = fetch_and_archive(
                      url,
                      source_id=source_id,
                      out_dir=raw,
                      timeout=12.0,
                      attempts=2,
                  )
                  item.update({
                      'ok': True,
                      'status': meta.status_code,
                      'final_url': meta.final_url,
                      'sha256': meta.sha256,
                      'bytes': meta.byte_count,
                      'content_type': meta.content_type,
                  })
                  status = 'partial'
                  note = 'Official entry point fetched and archived; dataset pagination/completeness not tested.'
              except Exception as exc:
                  item.update({'ok': False, 'error': f'{type(exc).__name__}: {exc}'})
                  status = 'unavailable'
                  note = f"Entry point could not be fetched in this bounded run: {item['error']}"
              rows.append(item)
              manifest.add(CoverageEntry(
                  dataset='source_entrypoint',
                  source_system=source_id,
                  status=status,
                  period_start=today,
                  period_end=today,
                  source_url=url,
                  evidence_path=str((raw / source_id).relative_to(root)),
                  filter_description='entry point availability only',
                  note=note,
              ))

          (out / 'summary.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          manifest.write(out / 'coverage.json')
          print(json.dumps(rows, ensure_ascii=False, indent=2, sort_keys=True))
          print(json.dumps(manifest.to_dict(), ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Commit source evidence
        run: |
          TODAY=$(TZ=America/Bahia date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cities/feira-de-santana/data/snapshots/${TODAY}/source_discovery"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(feira): preserve source discovery ${TODAY} [skip ci]"
          git pull --rebase origin city/feira-de-santana
          git push origin HEAD:city/feira-de-santana
