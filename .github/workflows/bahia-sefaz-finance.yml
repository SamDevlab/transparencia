name: Dados financeiros SEFAZ Bahia

on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * 2"
  push:
    branches:
      - city/salvador
    paths:
      - ".github/workflows/bahia-sefaz-finance.yml"
      - "src/transparencia/collectors/bahia_sefaz_finance.py"
      - "src/transparencia/collectors/bahia_sefaz_files.py"
      - "scripts/process-bahia-sefaz-data.py"
      - "tests/test_bahia_sefaz_finance.py"

permissions:
  contents: write

concurrency:
  group: bahia-sefaz-finance
  cancel-in-progress: true

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e '.[dev]'
      - name: Validar parsers financeiros
        id: tests
        shell: bash
        run: |
          pytest -q tests/test_bahia_sefaz_finance.py tests/test_bahia_sefaz_files.py
      - name: Processar Despesas e Pagamentos
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p regions/bahia/data/validation
          set +e
          python scripts/process-bahia-sefaz-data.py \
            --year 2026 \
            --datasets despesas pagamentos \
            2>&1 | tee regions/bahia/data/validation/sefaz_finance_collect.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Registrar diagnóstico financeiro
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def read_json(path, fallback=None):
              p = Path(path)
              if not p.exists():
                  return fallback
              return json.loads(p.read_text(encoding='utf-8'))

          def tail(path, lines=80):
              p = Path(path)
              if not p.exists():
                  return []
              return p.read_text(encoding='utf-8', errors='replace').splitlines()[-lines:]

          state = Path('regions/bahia/data/state_transparency')
          latest = read_json(state / 'latest.json', {})
          snapshot = Path(latest.get('path', '')) if latest.get('path') else None
          coverage = read_json(snapshot / 'coverage.json', {}) if snapshot else {}
          expenses = read_json(snapshot / 'sefaz_despesas.json') if snapshot else None
          payments = read_json(snapshot / 'sefaz_pagamentos.json') if snapshot else None
          payload = {
              'tested_commit': os.environ['TESTED_SHA'],
              'tests': os.environ.get('TEST_OUTCOME'),
              'collector': os.environ.get('COLLECT_OUTCOME'),
              'workflow_finished_at': datetime.now(timezone.utc).isoformat(),
              'latest': latest,
              'sefaz_data_summary': coverage.get('sefaz_data_summary'),
              'expenses_status': (coverage.get('sefaz_data') or {}).get('despesas'),
              'payments_status': (coverage.get('sefaz_data') or {}).get('pagamentos'),
              'collector_log_tail': tail('regions/bahia/data/validation/sefaz_finance_collect.log'),
          }
          if expenses:
              primary = expenses.get('summary', {}).get('primary_table') or {}
              payload['expenses'] = {
                  'resource': expenses.get('resource'),
                  'evidence': expenses.get('evidence'),
                  'selected_year': expenses.get('summary', {}).get('selected_year'),
                  'primary_member': primary.get('member'),
                  'selected_rows': primary.get('selected_rows'),
                  'stage_fields': (primary.get('schema', {}).get('detected_fields') or {}).get('stages'),
                  'stage_totals': primary.get('stage_totals'),
              }
          if payments:
              primary = payments.get('summary', {}).get('primary_table') or {}
              payload['payments'] = {
                  'resource': payments.get('resource'),
                  'evidence': payments.get('evidence'),
                  'selected_year': payments.get('summary', {}).get('selected_year'),
                  'primary_member': primary.get('member'),
                  'selected_rows': primary.get('selected_rows'),
                  'selected_year_payment': payments.get('summary', {}).get('selected_year_payment'),
              }
          out = Path('regions/bahia/data/validation/sefaz_finance_run.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f regions/bahia/data/validation/sefaz_finance_collect.log
      - name: Versionar somente resumos e evidências
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions/bahia/data/state_transparency regions/bahia/data/validation/sefaz_finance_run.json
          if ! git diff --cached --quiet; then
            git commit -m "data(bahia): atualizar despesas e pagamentos SEFAZ [skip ci]"
            git pull --rebase origin city/salvador
            git push origin HEAD:city/salvador
          else
            echo "Nenhuma alteração financeira estadual para versionar."
          fi
      - name: Exigir coleta financeira válida
        if: steps.tests.outcome != 'success' || steps.collect.outcome != 'success'
        run: |
          echo "tests=${{ steps.tests.outcome }} collector=${{ steps.collect.outcome }}"
          exit 1
