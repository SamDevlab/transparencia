name: Empenhos da Câmara de Salvador

on:
  workflow_dispatch:
  schedule:
    - cron: "25 12 * * 2,5"
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-cms-commitments-snapshot.yml
      - src/transparencia/collectors/cms_commitments.py

permissions:
  contents: write

concurrency:
  group: salvador-cms-commitments-snapshot
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate project tests
        run: pytest -q
      - name: Collect current default CMS commitment view
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from transparencia.collectors.cms_commitments import collect

          today = datetime.now(ZoneInfo('America/Bahia')).date()
          out = Path('cities/salvador/data/snapshots') / today.isoformat() / 'cms_commitments'
          result = collect(Path('.').resolve(), out)
          coverage = result['coverage']
          print(json.dumps(coverage, ensure_ascii=False, indent=2, sort_keys=True))
          if coverage.get('parser_complete_for_visible_records') is not True:
              raise SystemExit('CMS parser did not normalize every visible commitment; do not publish this run')
          PY
      - name: Commit source-scoped CMS snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=America/Bahia date +%F)
          git add "cities/salvador/data/snapshots/${TODAY}/cms_commitments"
          if git diff --cached --quiet; then echo 'No CMS commitment changes'; exit 0; fi
          git commit -m "data(salvador): refresh Câmara commitment ledger"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
