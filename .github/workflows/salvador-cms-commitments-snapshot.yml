name: salvador-cms-commitments-snapshot

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-cms-commitments-snapshot.yml
      - src/transparencia/collectors/cms_commitments.py

permissions:
  contents: write

concurrency:
  group: salvador-cms-commitments-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Collect and exhaust default CMS commitment view
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from transparencia.collectors.cms_commitments import collect
          out=Path('cities/salvador/data/snapshots/2026-08-17/cms_commitments_full')
          result=collect(Path('.').resolve(), out)
          print(json.dumps(result['coverage'], ensure_ascii=False, indent=2, sort_keys=True))
          if not result['coverage']['complete']:
              print('Coverage remains partial; records are still preserved with explicit status.')
          PY
      - run: pytest -q
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17/cms_commitments_full
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): collect default CMS commitment ledger"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
