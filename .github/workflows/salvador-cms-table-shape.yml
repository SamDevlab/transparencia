name: salvador-cms-table-shape

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-cms-table-shape.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx beautifulsoup4
      - name: Inspect public Câmara table shapes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import httpx
          from bs4 import BeautifulSoup

          apps={
            'contracts':'https://cmsalvador.sys.inf.br/ca/contrato/',
            'expenses':'https://cmsalvador.sys.inf.br/ca/gridRegistroDespesa/',
            'commitments':'https://cmsalvador.sys.inf.br/ca/gridRegistroEmpenho/',
            'payments':'https://cmsalvador.sys.inf.br/ca/trans_pagamento/',
            'procurements':'https://cmsalvador.sys.inf.br/ca/licitacao/',
          }
          headers={'user-agent':'municipal-transparency-research/0.2 (+public-data-audit)','accept':'text/html,application/xhtml+xml','accept-language':'pt-BR,pt;q=0.9'}
          out={}
          with httpx.Client(headers=headers,follow_redirects=True,timeout=40) as client:
            for name,url in apps.items():
              try:
                r=client.get(url)
                soup=BeautifulSoup(r.text,'html.parser')
                tables=[]
                for table in soup.find_all('table'):
                  rows=[]
                  for tr in table.find_all('tr'):
                    cells=[' '.join(c.get_text(' ',strip=True).split()) for c in tr.find_all(['th','td'])]
                    if cells and any(cells): rows.append(cells)
                  if rows:
                    tables.append({'rows_count_html':len(rows),'max_columns':max(len(x) for x in rows),'first_rows':rows[:15]})
                out[name]={'url':url,'status':r.status_code,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'tables':tables[:20]}
              except Exception as exc: out[name]={'url':url,'error':f'{type(exc).__name__}: {exc}'}
          p=Path('cities/salvador/data/snapshots/2026-08-17/cms_table_shapes.json')
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)[:60000])
          PY
      - name: Commit shapes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17/cms_table_shapes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): map Câmara financial table shapes"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
