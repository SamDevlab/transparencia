name: salvador-snapshot-v2

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-snapshot-v2.yml

permissions:
  contents: write

concurrency:
  group: salvador-snapshot-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Collect audited Salvador snapshot
        run: python scripts/collect_salvador_snapshot.py
      - name: Commit snapshot without overwriting concurrent work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "data(salvador): collect 2026-08-17 auditable snapshot"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
