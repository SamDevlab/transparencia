name: Feira de Santana — PNCP mensal limitado

on:
  workflow_dispatch:
  push:
    branches: [city/feira-de-santana]
    paths:
      - "cities/feira-de-santana/city.json"
      - "src/transparencia/collectors/pncp.py"
      - "src/transparencia/collectors/pncp_contracts.py"
      - ".github/workflows/feira-pncp-bounded.yml"

permissions:
  contents: write

concurrency:
  group: feira-pncp-bounded
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/feira-de-santana
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Collect bounded PNCP evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from transparencia.collectors.pncp import collect as collect_procurements
          from transparencia.collectors.pncp_contracts import collect as collect_contracts
          from transparencia.config import load_city
          from transparencia.coverage import CoverageEntry, CoverageManifest

          now = datetime.now(ZoneInfo('America/Bahia'))
          today = now.date()
          start = today.replace(day=1)
          root = Path.cwd()
          ws = load_city(root, 'feira-de-santana')
          out = root / 'cities' / 'feira-de-santana' / 'data' / 'snapshots' / today.isoformat() / 'pncp_bounded'
          out.mkdir(parents=True, exist_ok=True)

          summary = {
              'observed_at_date': today.isoformat(),
              'period_start': start.isoformat(),
              'period_end': today.isoformat(),
              'scope': 'executivo',
              'role': 'complementary_only',
              'procurements': {},
              'contracts': {},
          }

          proc_status = 'unavailable'
          proc_records = None
          try:
              proc_path = collect_procurements(ws.config, start, today, out / 'procurements', scope='executivo')
              proc_coverage_path = out / 'procurements' / 'coverage.json'
              proc_coverage = json.loads(proc_coverage_path.read_text(encoding='utf-8')) if proc_coverage_path.exists() else {}
              proc_records = int(proc_coverage.get('records') or 0)
              proc_status = 'complete_for_filter' if proc_coverage.get('complete') is True else 'partial'
              summary['procurements'] = {
                  'ok': True,
                  'path': str(proc_path.relative_to(root)),
                  'coverage': proc_coverage,
              }
          except Exception as exc:
              summary['procurements'] = {'ok': False, 'error': f'{type(exc).__name__}: {exc}'}

          contract_status = 'unavailable'
          contract_records = None
          try:
              contract_path = collect_contracts(
                  ws.config,
                  start,
                  today,
                  out / 'contracts',
                  agency_cnpjs=[ws.config.municipality_cnpj] if ws.config.municipality_cnpj else [],
                  scope='executivo',
              )
              contract_records = sum(1 for line in contract_path.read_text(encoding='utf-8').splitlines() if line.strip())
              # The current generic contract collector reaches natural pagination end but
              # does not yet persist enough source-reported page/total metadata to promote
              # this layer to complete_for_filter. Keep it explicitly partial.
              contract_status = 'partial'
              summary['contracts'] = {
                  'ok': True,
                  'path': str(contract_path.relative_to(root)),
                  'records': contract_records,
                  'agency_cnpj_scope': [ws.config.municipality_cnpj],
                  'coverage_limitation': 'pagination metadata is not yet persisted by the generic PNCP contract collector',
              }
          except Exception as exc:
              summary['contracts'] = {'ok': False, 'error': f'{type(exc).__name__}: {exc}'}

          manifest = CoverageManifest(
              city_slug=ws.config.slug,
              period_start=start.isoformat(),
              period_end=today.isoformat(),
          )
          manifest.add(CoverageEntry(
              dataset='pncp_procurements',
              source_system='PNCP',
              status=proc_status,
              period_start=start.isoformat(),
              period_end=today.isoformat(),
              records=proc_records,
              source_url='https://pncp.gov.br/',
              evidence_path=str((out / 'procurements').relative_to(root)),
              filter_description=f'executivo municipal de {ws.config.name}, {start.isoformat()} a {today.isoformat()}',
              note=(
                  'Complete only for the PNCP query domain, active modalities, municipal executive scope and stated date interval.'
                  if proc_status == 'complete_for_filter'
                  else 'PNCP procurement collection is partial or unavailable for this bounded run; persisted rows remain evidence only.'
              ),
          ))
          manifest.add(CoverageEntry(
              dataset='pncp_contracts',
              source_system='PNCP',
              status=contract_status,
              period_start=start.isoformat(),
              period_end=today.isoformat(),
              records=contract_records,
              source_url='https://pncp.gov.br/',
              evidence_path=str((out / 'contracts').relative_to(root)),
              filter_description=f'CNPJ institucional {ws.config.municipality_cnpj}, {start.isoformat()} a {today.isoformat()}',
              note=(
                  'Collected for the supplied institutional CNPJ, but kept partial until the generic contract collector persists source-reported pagination/count proof.'
                  if contract_status == 'partial'
                  else 'PNCP contract collection unavailable in this bounded run.'
              ),
          ))
          manifest.write(out / 'coverage.json')
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          print(json.dumps(manifest.to_dict(), ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Commit bounded PNCP evidence
        run: |
          TODAY=$(TZ=America/Bahia date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cities/feira-de-santana/data/snapshots/${TODAY}/pncp_bounded"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(feira): preserve bounded PNCP ${TODAY} [skip ci]"
          git pull --rebase origin city/feira-de-santana
          git push origin HEAD:city/feira-de-santana
