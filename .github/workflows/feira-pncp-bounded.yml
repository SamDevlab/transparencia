name: Feira de Santana — PNCP mensal limitado

on:
  workflow_dispatch:
  push:
    branches: [city/feira-de-santana]
    paths:
      - "cities/feira-de-santana/city.json"
      - "src/transparencia/collectors/pncp.py"
      - "src/transparencia/collectors/pncp_contracts.py"
      - "src/transparencia/reconcile.py"
      - ".github/workflows/feira-pncp-bounded.yml"

permissions:
  contents: write

concurrency:
  group: feira-pncp-bounded
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/feira-de-santana
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Collect bounded PNCP evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from transparencia.collectors.pncp import collect as collect_procurements
          from transparencia.collectors.pncp_contracts import (
              agency_cnpjs_from_procurements,
              collect as collect_contracts,
          )
          from transparencia.config import load_city
          from transparencia.coverage import CoverageEntry, CoverageManifest

          now = datetime.now(ZoneInfo('America/Bahia'))
          today = now.date()
          start = today.replace(day=1)
          root = Path.cwd()
          ws = load_city(root, 'feira-de-santana')
          out = root / 'cities' / 'feira-de-santana' / 'data' / 'snapshots' / today.isoformat() / 'pncp_bounded'
          out.mkdir(parents=True, exist_ok=True)

          summary = {
              'observed_at_date': today.isoformat(),
              'period_start': start.isoformat(),
              'period_end': today.isoformat(),
              'scope': 'executivo',
              'role': 'complementary_only',
              'procurements': {},
              'contracts': {},
          }

          proc_status = 'unavailable'
          proc_records = None
          proc_path = None
          try:
              proc_path = collect_procurements(ws.config, start, today, out / 'procurements', scope='executivo')
              proc_coverage_path = out / 'procurements' / 'coverage.json'
              proc_coverage = json.loads(proc_coverage_path.read_text(encoding='utf-8')) if proc_coverage_path.exists() else {}
              proc_records = int(proc_coverage.get('records') or 0)
              proc_status = 'complete_for_filter' if proc_coverage.get('complete') is True else 'partial'
              observed_cnpjs = list(agency_cnpjs_from_procurements([proc_path]))
              summary['procurements'] = {
                  'ok': True,
                  'path': str(proc_path.relative_to(root)),
                  'coverage': proc_coverage,
                  'agency_cnpjs_observed': observed_cnpjs,
              }
          except Exception as exc:
              observed_cnpjs = []
              summary['procurements'] = {'ok': False, 'error': f'{type(exc).__name__}: {exc}'}

          contract_status = 'unavailable'
          contract_records = None
          contract_coverage = {}
          agency_scope = set(observed_cnpjs)
          if ws.config.municipality_cnpj:
              agency_scope.add(ws.config.municipality_cnpj)
          agency_scope = sorted(agency_scope)
          try:
              contract_path = collect_contracts(
                  ws.config,
                  start,
                  today,
                  out / 'contracts',
                  agency_cnpjs=agency_scope,
                  scope='executivo',
              )
              contract_coverage_path = out / 'contracts' / 'coverage.json'
              contract_coverage = json.loads(contract_coverage_path.read_text(encoding='utf-8')) if contract_coverage_path.exists() else {}
              file_records = sum(1 for line in contract_path.read_text(encoding='utf-8').splitlines() if line.strip())
              contract_records = int(contract_coverage.get('records_unique_in_scope', file_records))
              if contract_records != file_records:
                  raise ValueError(f'contract record count mismatch: coverage={contract_records} file={file_records}')
              contract_status = (
                  'complete_for_filter'
                  if contract_coverage.get('complete_for_supplied_agencies_and_filter') is True
                  else 'partial'
              )
              summary['contracts'] = {
                  'ok': True,
                  'path': str(contract_path.relative_to(root)),
                  'records': contract_records,
                  'agency_cnpj_scope': agency_scope,
                  'agency_discovery_complete': False,
                  'agency_discovery_rule': 'official municipality CNPJ plus CNPJs observed in the bounded PNCP procurement rows; not a municipality-wide entity registry',
                  'coverage': contract_coverage,
              }
          except Exception as exc:
              summary['contracts'] = {
                  'ok': False,
                  'error': f'{type(exc).__name__}: {exc}',
                  'agency_cnpj_scope': agency_scope,
                  'agency_discovery_complete': False,
              }

          manifest = CoverageManifest(
              city_slug=ws.config.slug,
              period_start=start.isoformat(),
              period_end=today.isoformat(),
          )
          manifest.add(CoverageEntry(
              dataset='pncp_procurements',
              source_system='PNCP',
              status=proc_status,
              period_start=start.isoformat(),
              period_end=today.isoformat(),
              records=proc_records,
              source_url='https://pncp.gov.br/',
              evidence_path=str((out / 'procurements').relative_to(root)),
              filter_description=f'executivo municipal de {ws.config.name}, {start.isoformat()} a {today.isoformat()}',
              note=(
                  'Complete only for the PNCP query domain, active modalities, municipal executive scope and stated date interval.'
                  if proc_status == 'complete_for_filter'
                  else 'PNCP procurement collection is partial or unavailable for this bounded run; persisted rows remain evidence only.'
              ),
          ))
          manifest.add(CoverageEntry(
              dataset='pncp_contracts',
              source_system='PNCP',
              status=contract_status,
              period_start=start.isoformat(),
              period_end=today.isoformat(),
              records=contract_records,
              source_url='https://pncp.gov.br/',
              evidence_path=str((out / 'contracts').relative_to(root)),
              filter_description=f'CNPJs supplied/observed={len(agency_scope)}, {start.isoformat()} a {today.isoformat()}',
              note=(
                  'Complete only for the supplied CNPJs and stated date/scope after exact PNCP pagination/count reconciliation. Entity discovery remains incomplete municipality-wide.'
                  if contract_status == 'complete_for_filter'
                  else 'Contracts remain partial for the supplied/observed CNPJ set; entity discovery is also not municipality-wide.'
                  if contract_status == 'partial'
                  else 'PNCP contract collection unavailable in this bounded run.'
              ),
          ))
          manifest.write(out / 'coverage.json')
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          print(json.dumps(manifest.to_dict(), ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Build exact PNCP procurement-contract relations
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from transparencia.reconcile import normalize_identifier

          today = datetime.now(ZoneInfo('America/Bahia')).date()
          start = today.replace(day=1)
          root = Path.cwd()
          out = root / 'cities' / 'feira-de-santana' / 'data' / 'snapshots' / today.isoformat() / 'pncp_bounded'
          proc_path = out / 'procurements' / f'contratacoes_executivo_{start.isoformat()}_{today.isoformat()}.jsonl'
          contract_path = out / 'contracts' / f'contratos_executivo_{start.isoformat()}_{today.isoformat()}.jsonl'
          proc_coverage_path = out / 'procurements' / 'coverage.json'
          contract_coverage_path = out / 'contracts' / 'coverage.json'

          def read_jsonl(path):
              if not path.exists():
                  return []
              return [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]

          procurements = read_jsonl(proc_path)
          contracts = read_jsonl(contract_path)
          proc_coverage = json.loads(proc_coverage_path.read_text(encoding='utf-8')) if proc_coverage_path.exists() else {}
          contract_coverage = json.loads(contract_coverage_path.read_text(encoding='utf-8')) if contract_coverage_path.exists() else {}

          contracts_by_procurement = defaultdict(list)
          contracts_without_control = []
          for row in contracts:
              raw_key = row.get('pncp_procurement_control_number') or row.get('procurement_control_number')
              key = normalize_identifier(raw_key)
              if not key:
                  contracts_without_control.append(row.get('pncp_contract_control_number') or row.get('pncp_control_number'))
                  continue
              contracts_by_procurement[key].append(row)

          links = []
          linked_contract_controls = set()
          unmatched_procurements = []
          for procurement in procurements:
              raw_key = procurement.get('pncp_procurement_control_number') or procurement.get('pncp_control_number')
              key = normalize_identifier(raw_key)
              matches = contracts_by_procurement.get(key, []) if key else []
              if not matches:
                  unmatched_procurements.append(raw_key)
                  continue
              contract_items = []
              for contract in matches:
                  contract_control = contract.get('pncp_contract_control_number') or contract.get('pncp_control_number')
                  if contract_control:
                      linked_contract_controls.add(contract_control)
                  contract_items.append({
                      'pncp_contract_control_number': contract_control,
                      'contract_number': contract.get('contract_number'),
                      'process_number': contract.get('process_number'),
                      'agency_document': contract.get('agency_document') or contract.get('agency_cnpj'),
                      'global_value': contract.get('global_value'),
                      'signed_at': contract.get('signed_at'),
                      'source_url': contract.get('source_url'),
                  })
              links.append({
                  'pncp_procurement_control_number': raw_key,
                  'notice_number': procurement.get('notice_number'),
                  'process_number': procurement.get('process_number'),
                  'agency_document': procurement.get('agency_document') or procurement.get('agency_cnpj'),
                  'estimated_value': procurement.get('estimated_value'),
                  'published_at': procurement.get('published_at'),
                  'contracts': contract_items,
              })

          all_contract_controls = {
              row.get('pncp_contract_control_number') or row.get('pncp_control_number')
              for row in contracts
              if row.get('pncp_contract_control_number') or row.get('pncp_control_number')
          }
          unmatched_contracts = sorted(all_contract_controls - linked_contract_controls)
          exact_pairs = sum(len(item['contracts']) for item in links)
          input_complete = (
              proc_coverage.get('complete') is True
              and contract_coverage.get('complete_for_supplied_agencies_and_filter') is True
          )
          payload = {
              'observed_at_date': today.isoformat(),
              'period_start': start.isoformat(),
              'period_end': today.isoformat(),
              'source_system': 'PNCP',
              'identity_rule': 'Exact equality of the native PNCP procurement control number after formatting-only normalization: procurement numeroControlePNCP == contract numeroControlePNCPCompra. No name, object, supplier or semantic similarity is used.',
              'cardinality_rule': 'One procurement may legitimately reference zero, one or multiple contracts; every published pair must share the same native PNCP procurement control number.',
              'accounting_rule': 'This is procurement-to-contract documentary identity only. It does not establish commitment, liquidation or payment.',
              'coverage': {
                  'procurements_complete_for_filter': proc_coverage.get('complete') is True,
                  'contracts_complete_for_supplied_agencies_and_filter': contract_coverage.get('complete_for_supplied_agencies_and_filter') is True,
                  'agency_discovery_complete': contract_coverage.get('agency_discovery_complete') is True,
                  'relations_complete_for_current_input_snapshots': input_complete,
                  'municipality_wide_complete': False,
              },
              'summary': {
                  'procurements': len(procurements),
                  'contracts': len(contracts),
                  'procurements_with_exact_contracts': len(links),
                  'unique_contracts_linked': len(linked_contract_controls),
                  'exact_pairs': exact_pairs,
                  'unmatched_procurements': len(unmatched_procurements),
                  'unmatched_contracts': len(unmatched_contracts),
                  'contracts_without_procurement_control': len(contracts_without_control),
              },
              'links': links,
              'unmatched_procurement_control_numbers': sorted(value for value in unmatched_procurements if value),
              'unmatched_contract_control_numbers': unmatched_contracts,
              'contracts_without_procurement_control_numbers': sorted(value for value in contracts_without_control if value),
          }
          (out / 'pncp-links.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload['summary'], ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Commit bounded PNCP evidence
        run: |
          TODAY=$(TZ=America/Bahia date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cities/feira-de-santana/data/snapshots/${TODAY}/pncp_bounded"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(feira): preserve bounded PNCP ${TODAY} [skip ci]"
          git pull --rebase origin city/feira-de-santana
          git push origin HEAD:city/feira-de-santana
