name: salvador-acquisitions-snapshot

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-acquisitions-snapshot.yml
      - src/transparencia/collectors/salvador_acquisitions.py

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Collect complete official acquisition catalogue for the period
        run: |
          python - <<'PY'
          from datetime import date
          import json
          from pathlib import Path
          from transparencia.collectors.salvador_acquisitions import collect
          from transparencia.config import load_city

          ws = load_city(Path('.'), 'salvador')
          out = Path('cities/salvador/data/snapshots/2026-08-17/prefeitura_acquisitions')
          result = collect(ws.config, date(2026,1,1), date(2026,8,17), out)
          print(json.dumps(result['completeness'], ensure_ascii=False, indent=2)[:60000])
          if not result['completeness']['complete_for_filter']:
              raise SystemExit('Official acquisition pagination was not completely captured')
          PY
      - run: pytest -q
      - name: Commit verified acquisition snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17/prefeitura_acquisitions
          if git diff --cached --quiet; then echo 'No acquisition snapshot changes'; exit 0; fi
          git commit -m "data(salvador): preserve complete 2026 acquisition API snapshot"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
