name: Aquisições municipais Salvador

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * 1-5"
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-acquisitions-snapshot.yml
      - src/transparencia/collectors/salvador_acquisitions.py

permissions:
  contents: write

concurrency:
  group: salvador-acquisitions-snapshot
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Validate project tests
        run: pytest -q
      - name: Collect complete official acquisition catalogue for current year
        run: |
          python - <<'PY'
          from datetime import date, datetime
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from transparencia.collectors.salvador_acquisitions import collect
          from transparencia.config import load_city

          today = datetime.now(ZoneInfo('America/Bahia')).date()
          start = date(today.year, 1, 1)
          ws = load_city(Path('.'), 'salvador')
          out = Path('cities/salvador/data/snapshots') / today.isoformat() / 'prefeitura_acquisitions'
          result = collect(ws.config, start, today, out)
          completeness = result['completeness']
          print(json.dumps(completeness, ensure_ascii=False, indent=2)[:60000])
          if not completeness['complete_for_filter']:
              raise SystemExit('Official acquisition pagination was not completely captured')
          if completeness.get('unique_stable_records') != completeness.get('api_reported_total_records'):
              raise SystemExit('Acquisition unique-record count diverges from source-reported total')
          PY
      - name: Commit verified acquisition snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=America/Bahia date +%F)
          git add "cities/salvador/data/snapshots/${TODAY}/prefeitura_acquisitions"
          if git diff --cached --quiet; then echo 'No acquisition snapshot changes'; exit 0; fi
          git commit -m "data(salvador): refresh complete municipal acquisitions"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
