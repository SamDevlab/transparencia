name: Feira de Santana — estrutura do portal executivo

on:
  workflow_dispatch:
  push:
    branches: [city/feira-de-santana]
    paths:
      - "cities/feira-de-santana/sources.csv"
      - ".github/workflows/feira-portal-structure-probe.yml"

permissions:
  contents: write

concurrency:
  group: feira-portal-structure-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/feira-de-santana
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Discover same-host transparency routes
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from zoneinfo import ZoneInfo

          import httpx

          from transparencia.provenance import persist_snapshot

          ROOT_URL = 'https://transparencia.feiradesantana.ba.gov.br/'
          KEYWORDS = ('contrat', 'licit', 'despes', 'receit', 'empenh', 'pagament', 'fornecedor', 'obra', 'diaria')
          today = datetime.now(ZoneInfo('America/Bahia')).date().isoformat()
          root = Path.cwd()
          out = root / 'cities' / 'feira-de-santana' / 'data' / 'snapshots' / today / 'portal_structure_probe'
          raw = out / 'raw'
          out.mkdir(parents=True, exist_ok=True)

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ('href', 'src', 'action'):
                      value = values.get(key)
                      if value:
                          self.urls.add(value.strip())

          headers = {
              'User-Agent': 'transparencia-municipal/0.3 (+public-data-audit)',
              'Accept': 'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
          }
          report = {
              'observed_at_date': today,
              'root_url': ROOT_URL,
              'rule': 'Discovery only. A reachable route is not complete_for_filter and does not establish record-level semantics.',
              'root': {},
              'candidate_routes': [],
              'fetched_candidates': [],
          }

          with httpx.Client(headers=headers, follow_redirects=True, timeout=45.0) as client:
              response = client.get(ROOT_URL)
              body = response.content
              meta = persist_snapshot(
                  out_dir=raw,
                  source_id='portal_root',
                  requested_url=ROOT_URL,
                  final_url=str(response.url),
                  status_code=response.status_code,
                  content_type=response.headers.get('content-type', ''),
                  body=body,
              )
              report['root'] = {
                  'status': response.status_code,
                  'final_url': str(response.url),
                  'content_type': response.headers.get('content-type'),
                  'bytes': len(body),
                  'sha256': meta.sha256,
              }
              response.raise_for_status()

              parser = LinkParser()
              parser.feed(response.text)
              root_host = urlparse(str(response.url)).netloc.casefold()
              candidates = set()
              for value in parser.urls:
                  absolute = urljoin(str(response.url), value)
                  parsed = urlparse(absolute)
                  if parsed.scheme not in {'http', 'https'} or parsed.netloc.casefold() != root_host:
                      continue
                  haystack = absolute.casefold()
                  if any(keyword in haystack for keyword in KEYWORDS):
                      candidates.add(absolute)
              report['candidate_routes'] = sorted(candidates)

              for index, url in enumerate(sorted(candidates)[:30], start=1):
                  item = {'url': url}
                  try:
                      r = client.get(url)
                      content = r.content
                      snapshot = persist_snapshot(
                          out_dir=raw,
                          source_id=f'candidate_{index:02d}',
                          requested_url=url,
                          final_url=str(r.url),
                          status_code=r.status_code,
                          content_type=r.headers.get('content-type', ''),
                          body=content,
                      )
                      item.update({
                          'status': r.status_code,
                          'final_url': str(r.url),
                          'content_type': r.headers.get('content-type'),
                          'bytes': len(content),
                          'sha256': snapshot.sha256,
                      })
                      if 'html' in (r.headers.get('content-type') or '').casefold():
                          text = re.sub(r'\s+', ' ', r.text)
                          item['mentions'] = sorted({keyword for keyword in KEYWORDS if keyword in text.casefold()})
                  except Exception as exc:
                      item['error'] = f'{type(exc).__name__}: {exc}'
                  report['fetched_candidates'].append(item)

          successful = [row for row in report['fetched_candidates'] if row.get('status') == 200]
          report['assessment'] = {
              'root_reachable': report['root'].get('status') == 200,
              'same_host_candidates': len(report['candidate_routes']),
              'candidate_http_200': len(successful),
              'can_claim_dataset_completeness': False,
              'next_step': 'Inspect preserved candidate routes for structured APIs/forms/pagination before writing dataset collectors.',
          }
          (out / 'summary.json').write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Commit portal probe evidence
        run: |
          TODAY=$(TZ=America/Bahia date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cities/feira-de-santana/data/snapshots/${TODAY}/portal_structure_probe"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(feira): preserve portal structure probe ${TODAY} [skip ci]"
          git pull --rebase origin city/feira-de-santana
          git push origin HEAD:city/feira-de-santana
