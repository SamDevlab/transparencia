name: Feira de Santana — estrutura do portal executivo

on:
  workflow_dispatch:
  push:
    branches: [city/feira-de-santana]
    paths:
      - "cities/feira-de-santana/sources.csv"
      - ".github/workflows/feira-portal-structure-probe.yml"

permissions:
  contents: write

concurrency:
  group: feira-portal-structure-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/feira-de-santana
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Probe known official transparency routes
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from zoneinfo import ZoneInfo

          import httpx

          from transparencia.provenance import persist_snapshot

          ROOT_URL = 'https://transparencia.feiradesantana.ba.gov.br/'
          ROUTES = [
              ('root', ROOT_URL),
              ('receita', ROOT_URL + 'index.php?view=receita'),
              ('despesa', ROOT_URL + 'index.php?view=despesasinfo'),
              ('licitacoes', ROOT_URL + 'index.php?view=licitacoes'),
              ('contratos', ROOT_URL + 'index.php?view=contratos'),
          ]
          KEYWORDS = ('contrat', 'licit', 'despes', 'receit', 'empenh', 'pagament', 'fornecedor', 'obra', 'diaria')
          today = datetime.now(ZoneInfo('America/Bahia')).date().isoformat()
          repo_root = Path.cwd()
          out = repo_root / 'cities' / 'feira-de-santana' / 'data' / 'snapshots' / today / 'portal_structure_probe'
          raw = out / 'raw'
          out.mkdir(parents=True, exist_ok=True)

          class StructureParser(HTMLParser):
              def __init__(self, base_url):
                  super().__init__()
                  self.base_url = base_url
                  self.links = set()
                  self.scripts = set()
                  self.forms = []
                  self.current_form = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('href'):
                      self.links.add(urljoin(self.base_url, values['href'].strip()))
                  if tag == 'script' and values.get('src'):
                      self.scripts.add(urljoin(self.base_url, values['src'].strip()))
                  if tag == 'form':
                      self.current_form = {
                          'method': str(values.get('method') or 'GET').upper(),
                          'action': urljoin(self.base_url, values.get('action') or self.base_url),
                          'inputs': [],
                      }
                      self.forms.append(self.current_form)
                  if tag in {'input', 'select', 'textarea'} and self.current_form is not None:
                      name = values.get('name')
                      if name:
                          self.current_form['inputs'].append(name)
              def handle_endtag(self, tag):
                  if tag == 'form':
                      self.current_form = None

          headers = {
              'User-Agent': 'transparencia-municipal/0.4 (+public-data-audit)',
              'Accept': 'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
          }
          report = {
              'observed_at_date': today,
              'root_url': ROOT_URL,
              'rule': 'Diagnostic structure only. Reachability, forms or route names never imply dataset completeness.',
              'routes': [],
              'same_host_discovered_routes': [],
              'same_host_scripts': [],
          }
          discovered_routes = set()
          scripts = set()

          with httpx.Client(headers=headers, follow_redirects=True, timeout=12.0) as client:
              for index, (name, url) in enumerate(ROUTES, start=1):
                  item = {'name': name, 'url': url}
                  try:
                      response = client.get(url)
                      body = response.content
                      snapshot = persist_snapshot(
                          out_dir=raw,
                          source_id=f'{index:02d}_{name}',
                          requested_url=url,
                          final_url=str(response.url),
                          status_code=response.status_code,
                          content_type=response.headers.get('content-type', ''),
                          body=body,
                      )
                      item.update({
                          'status': response.status_code,
                          'final_url': str(response.url),
                          'content_type': response.headers.get('content-type'),
                          'bytes': len(body),
                          'sha256': snapshot.sha256,
                      })
                      if response.status_code == 200 and 'html' in (response.headers.get('content-type') or '').casefold():
                          parser = StructureParser(str(response.url))
                          parser.feed(response.text)
                          root_host = urlparse(ROOT_URL).netloc.casefold()
                          same_host = {
                              link for link in parser.links
                              if urlparse(link).scheme in {'http', 'https'}
                              and urlparse(link).netloc.casefold() == root_host
                          }
                          relevant = {
                              link for link in same_host
                              if any(keyword in link.casefold() for keyword in KEYWORDS)
                          }
                          discovered_routes.update(relevant)
                          scripts.update(
                              script for script in parser.scripts
                              if urlparse(script).netloc.casefold() == root_host
                          )
                          item['forms'] = parser.forms
                          item['form_count'] = len(parser.forms)
                          item['same_host_relevant_links'] = sorted(relevant)
                          item['script_sources'] = sorted(parser.scripts)
                  except Exception as exc:
                      item['error'] = f'{type(exc).__name__}: {exc}'
                  report['routes'].append(item)

          report['same_host_discovered_routes'] = sorted(discovered_routes)
          report['same_host_scripts'] = sorted(scripts)
          ok = [row for row in report['routes'] if row.get('status') == 200]
          report['assessment'] = {
              'routes_attempted': len(report['routes']),
              'routes_http_200': len(ok),
              'route_failures': len(report['routes']) - len(ok),
              'forms_observed': sum(int(row.get('form_count') or 0) for row in report['routes']),
              'can_claim_dataset_completeness': False,
              'next_step': 'Use only preserved form/action/script evidence to discover structured requests and pagination. Do not infer endpoints from labels or text.',
          }
          (out / 'summary.json').write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Commit portal probe evidence
        run: |
          TODAY=$(TZ=America/Bahia date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cities/feira-de-santana/data/snapshots/${TODAY}/portal_structure_probe"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(feira): preserve portal structure probe ${TODAY} [skip ci]"
          git pull --rebase origin city/feira-de-santana
          git push origin HEAD:city/feira-de-santana
