name: salvador-api-summary

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-api-summary.yml
      - scripts/summarize_salvador_api_calls.py
      - scripts/summarize_salvador_expense_probe.py
      - cities/salvador/data/snapshots/2026-08-17/prefeitura_api/expense_detail_probe.json

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/summarize_salvador_api_calls.py
      - run: python scripts/summarize_salvador_expense_probe.py
      - name: Commit concise API maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cities/salvador/data/snapshots/2026-08-17/discovery/prefeitura_portal/lazy_chunks/api_call_signatures.json \
            cities/salvador/data/snapshots/2026-08-17/prefeitura_api/expense_detail_probe_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): summarize finance API probes"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
