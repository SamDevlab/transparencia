name: salvador-lazy-chunks

on:
  workflow_dispatch:
  push:
    branches: [city/salvador]
    paths:
      - .github/workflows/salvador-lazy-chunks.yml
      - scripts/discover_salvador_lazy_chunks.py

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: city/salvador
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python scripts/discover_salvador_lazy_chunks.py
      - name: Commit audited chunk map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities/salvador/data/snapshots/2026-08-17/discovery/prefeitura_portal/lazy_chunks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(salvador): archive finance portal lazy chunks"
          git fetch origin city/salvador
          git rebase origin/city/salvador
          git push origin HEAD:city/salvador
